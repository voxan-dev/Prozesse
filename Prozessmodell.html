<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Prozessmodell</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Public+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --paper:#F3F5F2; --surface:#FFFFFF; --ink:#1B2430; --muted:#5B6573; --rule:#D6DBD3; --lane:#E9ECE6;
  --role:#7B3F6E; --data:#9A5F0C; --system:#2F6B57; --sel:#2E4FD1; --warn:#A33A2A; --crit:#C2410C;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px); padding-bottom:env(safe-area-inset-bottom,0px);
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#14181D; --surface:#1C2128; --ink:#E6E9EC; --muted:#9AA3AD; --rule:#313842; --lane:#191E24;
    --role:#D294C4; --data:#E3AA52; --system:#74C3A3; --sel:#8098FF; --warn:#F08A78; --crit:#FB923C;
  }
}
:root[data-theme="dark"]{
  --paper:#14181D; --surface:#1C2128; --ink:#E6E9EC; --muted:#9AA3AD; --rule:#313842; --lane:#191E24;
  --role:#D294C4; --data:#E3AA52; --system:#74C3A3; --sel:#8098FF; --warn:#F08A78; --crit:#FB923C;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;height:100%;background:var(--paper);color:var(--ink);
  font:14px/1.45 "Public Sans",system-ui,-apple-system,"Segoe UI",Roboto,Arial,sans-serif;font-variant-numeric:tabular-nums}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--sel);outline-offset:2px}
.app{display:grid;grid-template-rows:auto 1fr;height:100%}

header{display:flex;align-items:center;gap:16px;padding:10px 18px;border-bottom:1px solid var(--rule);background:var(--surface);flex-wrap:wrap;position:relative;z-index:10}
.brand{font-weight:700;font-size:16px;letter-spacing:-.01em;display:flex;align-items:center;gap:8px}
.tabs{display:flex;gap:2px;background:var(--paper);border:1px solid var(--rule);border-radius:8px;padding:2px;flex-wrap:wrap}
.tabs button{border:0;background:none;padding:5px 12px;border-radius:6px;font-weight:500;color:var(--muted)}
.tabs button[aria-pressed="true"]{background:var(--surface);color:var(--ink);box-shadow:0 0 0 1px var(--rule)}
.gsearch{position:relative;flex:1;min-width:180px;max-width:340px}
.gsearch input{width:100%;border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:5px 10px 5px 30px}
.gsearch input:focus{outline:none;border-color:var(--sel);background:var(--surface)}
.gsearch svg{position:absolute;left:9px;top:50%;margin-top:-7px;color:var(--muted)}
.gsearch input:focus~kbd,.gsearch input:not(:placeholder-shown)~kbd{display:none}
.gsearch kbd{position:absolute;right:8px;top:50%;transform:translateY(-50%);font:11px ui-monospace,Consolas,monospace;color:var(--muted);border:1px solid var(--rule);border-radius:4px;padding:0 4px}
.gres{position:absolute;left:0;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--rule);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.14);max-height:60vh;overflow:auto;padding:4px;min-width:320px}
.gres[hidden]{display:none}
.gres button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:6px;padding:6px 8px}
.gres button:hover,.gres button.act{background:var(--lane)}
.gres .k{font-size:11px;color:var(--muted);font-weight:600}
.gres .l{font-weight:600}
.gres .s{font-size:12px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.gres mark{background:color-mix(in srgb,var(--data) 25%,transparent);color:inherit;border-radius:2px}
.hright{margin-left:auto;display:flex;align-items:center;gap:6px;flex-wrap:wrap}
.status{font-size:12px;color:var(--muted);margin-right:4px}
.status.err{color:var(--warn)}
.btn{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:5px 11px;font-size:13px;font-weight:500}
.btn:hover{border-color:var(--muted)}
.btn.primary{background:var(--ink);color:var(--surface);border-color:var(--ink)}
.btn.danger{color:var(--warn)}
.btn.danger.armed{background:var(--warn);color:#fff;border-color:var(--warn)}
.btn.sm{padding:3px 8px;font-size:12px}
.btn[aria-pressed="true"]{background:var(--crit);border-color:var(--crit);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.linkbtn{border:0;background:none;padding:0;color:var(--sel);font-size:13px;text-align:left}
.linkbtn:hover{text-decoration:underline}
.x{border:0;background:none;color:var(--muted);padding:0 4px;font-size:15px;line-height:1}
.x:hover{color:var(--warn)}
.undo{display:flex;gap:2px}
.undo .btn{padding:5px 9px}
.menu{position:relative}
.dd{position:absolute;right:0;top:calc(100% + 4px);background:var(--surface);border:1px solid var(--rule);border-radius:8px;box-shadow:0 10px 30px rgba(0,0,0,.14);padding:4px;min-width:250px}
.dd[hidden]{display:none}
.dd button{display:block;width:100%;text-align:left;border:0;background:none;border-radius:6px;padding:7px 10px}
.dd button:hover{background:var(--lane)}
.dd small{display:block;color:var(--muted);font-size:12px}
.dd hr{border:0;border-top:1px solid var(--rule);margin:4px 0}

.work{display:grid;grid-template-columns:240px minmax(0,1fr) 380px;min-height:0}
.work.wide{grid-template-columns:240px minmax(0,1fr)}
.work.wide .insp{display:none}
.side{border-right:1px solid var(--rule);overflow:auto;padding:14px 10px}
.main{overflow:auto;min-width:0;display:flex;flex-direction:column}
.insp{border-left:1px solid var(--rule);overflow:auto;background:var(--surface);padding:16px 18px 40px}
@media (max-width:1000px){
  .app{height:auto;min-height:100%}
  .work,.work.wide{grid-template-columns:1fr}
  .side{border-right:0;border-bottom:1px solid var(--rule);max-height:240px}
  .main{min-height:60vh}
  .insp{border-left:0;border-top:1px solid var(--rule)}
}
.side h3{font-size:13px;font-weight:600;color:var(--muted);margin:2px 8px 8px;display:flex;justify-content:space-between;align-items:center;gap:6px}
.side h3+.navitem{margin-top:0}
.side .sep{height:1px;background:var(--rule);margin:14px 6px}
.navitem{display:block;width:100%;text-align:left;border:0;background:none;border-radius:6px;padding:7px 8px;margin-bottom:1px}
.navitem:hover{background:var(--lane)}
.navitem[aria-current="true"]{background:var(--surface);box-shadow:inset 0 0 0 1px var(--rule)}
.navitem .t{font-weight:600;display:flex;align-items:center;gap:7px}
.navitem .m{font-size:12px;color:var(--muted)}
.navitem .s{font-size:12px;margin-top:1px}
.dot{width:8px;height:8px;border-radius:50%;flex:none}
.dot.role{background:var(--role)} .dot.data{background:var(--data)} .dot.system{background:var(--system)}
.badge{font-size:11px;border:1px solid var(--rule);border-radius:4px;padding:0 5px;color:var(--muted);font-weight:500;white-space:nowrap}

.bar{display:flex;align-items:center;gap:10px;padding:12px 20px;border-bottom:1px solid var(--rule);flex-wrap:wrap}
.bar h2{margin:0;font-size:20px;font-weight:700;letter-spacing:-.015em}
.bar .meta{color:var(--muted);font-size:13px}
.bar .grow{flex:1}
.crumbs{width:100%;font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center;margin-bottom:-4px}
.crumbs .linkbtn{font-size:12px}
.seg{display:flex;border:1px solid var(--rule);border-radius:6px;overflow:hidden}
.seg button{border:0;background:var(--surface);padding:5px 11px;font-size:13px;color:var(--muted)}
.seg button+button{border-left:1px solid var(--rule)}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--surface)}
.search{border:1px solid var(--rule);background:var(--surface);border-radius:6px;padding:5px 10px;min-width:180px}
.critbar{padding:8px 20px;font-size:13px;border-bottom:1px solid var(--rule);background:color-mix(in srgb,var(--crit) 8%,transparent);display:flex;gap:16px;flex-wrap:wrap}
.critbar b{color:var(--crit)}

.scroller{overflow:auto;flex:1}
.canvas{position:relative}
.canvas.free{background-image:radial-gradient(circle,var(--rule) 1px,transparent 1.2px);background-size:20px 20px;min-width:100%;min-height:100%}
.lane{position:absolute;left:0;border-bottom:1px solid var(--rule)}
.lane:nth-child(even){background:var(--lane)}
.lanelabel{position:absolute;left:0;top:0;bottom:0;width:150px;padding:12px 12px 12px 18px;border-right:1px solid var(--rule)}
.lanelabel button{border:0;background:none;padding:0;text-align:left;font-weight:600;color:var(--role);hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;line-height:1.3;max-width:100%}
.lanelabel button:hover{text-decoration:underline}
.lanelabel .none{color:var(--muted);font-weight:500}
.lanelabel .sum{display:block;font-size:12px;color:var(--muted);margin-top:2px}
svg.edges{position:absolute;left:0;top:0;pointer-events:none;overflow:visible}
svg.edges path{fill:none;stroke:var(--muted);stroke-width:1.4}
svg.edges path.crit{stroke:var(--crit);stroke-width:2.6}
svg.edges path.tmp{stroke:var(--sel);stroke-dasharray:5 4}
svg.edges text{font-size:11px;fill:var(--muted)}
svg.edges .lbl-bg{fill:var(--paper)}

.node{position:absolute;text-align:left;background:var(--surface);border:1px solid var(--rule);border-radius:7px;padding:8px 11px;display:flex;flex-direction:column;gap:3px}
.node:hover{border-color:var(--muted)}
.node.sel{border-color:var(--sel);box-shadow:0 0 0 1px var(--sel)}
.node.crit{border-color:var(--crit);box-shadow:0 0 0 2px var(--crit)}
.node.sel.crit{box-shadow:0 0 0 2px var(--crit),0 0 0 4px var(--sel)}
.node.free{cursor:grab;touch-action:none}
.node.free.dragging{cursor:grabbing;box-shadow:0 6px 18px rgba(0,0,0,.14);z-index:5}
.node.drop{border-color:var(--sel)!important;box-shadow:0 0 0 2px var(--sel)!important}
.n-own{font-size:12px;font-weight:600;color:var(--role);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-own.none{color:var(--muted);font-weight:500}
.n-name{font-weight:600;line-height:1.25;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden}
.n-io{font-size:12px;display:flex;gap:6px;min-width:0;align-items:baseline}
.n-k{color:var(--muted);flex:none;width:24px}
.n-v{color:var(--data);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-v.empty{color:var(--muted)}
.n-sub{font-size:12px;color:var(--sel);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.n-wait{font-size:12px;color:var(--muted)}
.n-time{margin-top:auto;font-size:12px;color:var(--muted);display:flex;justify-content:space-between;gap:6px}
.n-sys{color:var(--system);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:110px}
.node.t-wait{border-style:dashed}
.node.t-sub{border:3px double var(--rule)}
.node.t-sub.sel{border-color:var(--sel)}
.node.t-start,.node.t-end{border-radius:999px;align-items:center;justify-content:center;text-align:center;padding:6px 16px}
.node.t-start{border:2px solid var(--system)}
.node.t-end{border:3px solid var(--ink)}
.node.t-start .n-name,.node.t-end .n-name{font-size:13px}
.node.t-decision{background:none;border:0;padding:0 34px;align-items:center;justify-content:center;text-align:center;box-shadow:none!important}
.node.t-decision svg.dia{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.node.t-decision svg.dia polygon{fill:var(--surface);stroke:var(--muted);stroke-width:1.2}
.node.t-decision.sel svg.dia polygon{stroke:var(--sel);stroke-width:2.4}
.node.t-decision.crit svg.dia polygon{stroke:var(--crit);stroke-width:3}
.node.t-decision .n-name{position:relative;font-size:12.5px;-webkit-line-clamp:3}
.node.t-decision .n-time{position:relative;margin-top:2px}
.cbadge{position:absolute;top:-9px;right:10px;background:var(--data);color:#fff;font-size:11px;font-weight:700;border-radius:9px;padding:0 6px 0 5px;line-height:18px;display:flex;gap:3px;align-items:center}
.handle{position:absolute;right:-8px;top:50%;width:14px;height:14px;margin-top:-7px;border-radius:50%;background:var(--surface);border:2px solid var(--sel);opacity:0;cursor:crosshair;touch-action:none}
.node.free:hover .handle,.node.free.sel .handle,.node.free:focus-visible .handle{opacity:1}

.empty{max-width:460px;margin:60px auto;padding:0 20px;text-align:center;color:var(--muted)}
.empty h2{color:var(--ink);font-size:18px;margin:0 0 8px}
.empty .btns{display:flex;gap:8px;justify-content:center;margin-top:16px;flex-wrap:wrap}

table.objs{width:100%;border-collapse:collapse}
.objs th{text-align:left;font-size:12px;font-weight:600;color:var(--muted);padding:10px 20px 6px;border-bottom:1px solid var(--rule)}
.objs td{padding:9px 20px;border-bottom:1px solid var(--rule);vertical-align:top}
.objs tr.row{cursor:pointer}
.objs tr.row:hover td{background:var(--lane)}
.objs tr.row.sel td{background:color-mix(in srgb,var(--sel) 9%,transparent)}
.objs .nm{font-weight:600}
.objs .ds{color:var(--muted);font-size:12px}
.objs .num{text-align:right;white-space:nowrap}
.tablewrap{overflow-x:auto}

/* RACI */
.raciwrap{padding:16px 20px 40px;overflow:auto}
.racictl{display:flex;gap:14px;align-items:center;flex-wrap:wrap;margin-bottom:12px;font-size:13px}
.racictl .picker{min-width:240px}
table.raci{border-collapse:separate;border-spacing:0;font-size:13px}
.raci th,.raci td{border-bottom:1px solid var(--rule);border-right:1px solid var(--rule);padding:0}
.raci thead th{position:sticky;top:0;background:var(--paper);z-index:1;font-weight:600;font-size:12px;padding:8px 6px;vertical-align:bottom;min-width:84px;max-width:120px}
.raci thead th button{border:0;background:none;padding:0;color:var(--role);font-weight:600;text-align:left;hyphens:auto;-webkit-hyphens:auto;overflow-wrap:break-word;max-width:100%}
.raci th.stepcol{left:0;z-index:2;min-width:220px;text-align:left}
.raci td.stepcell{position:sticky;left:0;background:var(--surface);padding:6px 10px;min-width:220px;max-width:280px}
.raci td.stepcell button{border:0;background:none;padding:0;text-align:left;font-weight:600}
.raci td.stepcell button:hover{color:var(--sel)}
.raci td.stepcell small{display:block;color:var(--muted);font-weight:400}
.raci tbody tr{height:48px}
.raci td.cell{height:48px}
.raci td.cell button{width:100%;height:100%;min-height:46px;border:0;background:var(--surface);font-weight:700;font-size:13px;letter-spacing:.02em}
.raci td.cell button:hover{background:var(--lane)}
.raci td.cell button.v-R,.raci td.cell button.v-RA{background:color-mix(in srgb,var(--role) 16%,var(--surface));color:var(--role)}
.raci td.cell button.v-A{background:color-mix(in srgb,var(--sel) 13%,var(--surface));color:var(--sel)}
.raci td.cell button.v-C{background:color-mix(in srgb,var(--data) 13%,var(--surface));color:var(--data)}
.raci td.cell button.v-I{background:color-mix(in srgb,var(--system) 12%,var(--surface));color:var(--system)}
.raci td.chk{padding:6px 10px;font-size:12px;color:var(--warn);white-space:nowrap;background:var(--surface)}
.raci td.chk.ok{color:var(--system)}
.raci tfoot td{padding:6px;font-size:12px;color:var(--muted);text-align:center;background:var(--paper)}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--muted);margin-top:12px}
.legend b{display:inline-block;min-width:26px;text-align:center;border-radius:4px;margin-right:4px}

/* flow */
svg.flow .fe{fill:none;stroke:var(--muted);stroke-width:1.3;opacity:.8}
svg.flow .fe.hi{stroke:var(--sel);stroke-width:2;opacity:1}
svg.flow .fe.dim,svg.flow .fn.dim{opacity:.18}
svg.flow .fn{cursor:pointer}
svg.flow .fn rect{stroke-width:1.2}
svg.flow .fn.d rect{fill:color-mix(in srgb,var(--data) 12%,var(--surface));stroke:var(--data)}
svg.flow .fn.s rect{fill:var(--surface);stroke:var(--muted)}
svg.flow .fn.sel rect{stroke:var(--sel);stroke-width:2.6}
svg.flow .fn text{font-size:12.5px;fill:var(--ink)}
svg.flow .fn text.sub{font-size:11px;fill:var(--muted)}
svg.flow .fn.d text.t{fill:var(--data);font-weight:600}
svg.flow .fn:focus{outline:none}
svg.flow .fn:focus-visible rect{stroke:var(--sel);stroke-width:2.6}

.insp h2{font-size:18px;margin:0 0 2px;letter-spacing:-.01em}
.kind{font-size:12px;font-weight:600;display:inline-flex;gap:6px;align-items:center;margin-bottom:10px}
.kind.role{color:var(--role)} .kind.data{color:var(--data)} .kind.system{color:var(--system)} .kind.step{color:var(--sel)}
.sec{margin-top:18px}
.sec>h4{font-size:13px;font-weight:600;margin:0 0 6px;display:flex;justify-content:space-between;align-items:center;gap:8px}
.sec>h4 small{font-weight:400;color:var(--muted)}
label.f{display:block;font-size:12px;color:var(--muted);margin:10px 0 4px}
.inp,textarea.inp,select.inp{width:100%;border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:6px 9px}
textarea.inp{resize:vertical;min-height:56px}
.inp:focus{border-color:var(--sel);outline:none;background:var(--surface)}
.big.inp{font-size:16px;font-weight:600}
.row2{display:flex;gap:6px;align-items:center}
.row2 .inp{flex:1}
.hint{font-size:12px;color:var(--muted);margin-top:4px}
.warn{font-size:12px;color:var(--warn);margin-top:6px}
.typesel{display:grid;grid-template-columns:repeat(3,1fr);gap:4px;margin-bottom:12px}
.typesel button{border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:5px 4px;font-size:12px;color:var(--muted)}
.typesel button[aria-pressed="true"]{border-color:var(--sel);color:var(--sel);background:color-mix(in srgb,var(--sel) 8%,var(--surface));font-weight:600}
.picker{border:1px solid var(--rule);background:var(--paper);border-radius:6px;padding:4px;display:flex;flex-wrap:wrap;gap:4px;align-items:center}
.picker:focus-within{border-color:var(--sel)}
.picker input{border:0;background:none;flex:1;min-width:120px;padding:3px 5px}
.picker input:focus{outline:none}
.raci-l{display:grid;grid-template-columns:22px 1fr;gap:6px;align-items:center;margin-bottom:6px}
.raci-l b{font-size:12px;text-align:center;border-radius:4px;padding:2px 0}
.raci-l b.R{color:var(--role);background:color-mix(in srgb,var(--role) 13%,transparent)}
.raci-l b.A{color:var(--sel);background:color-mix(in srgb,var(--sel) 12%,transparent)}
.raci-l b.C{color:var(--data);background:color-mix(in srgb,var(--data) 13%,transparent)}
.raci-l b.I{color:var(--system);background:color-mix(in srgb,var(--system) 13%,transparent)}
.chip{display:inline-flex;align-items:center;gap:2px;border-radius:5px;font-size:12.5px;font-weight:500;padding:2px 2px 2px 7px;max-width:100%}
.chip.role{background:color-mix(in srgb,var(--role) 13%,transparent);color:var(--role)}
.chip.data{background:color-mix(in srgb,var(--data) 14%,transparent);color:var(--data)}
.chip.system{background:color-mix(in srgb,var(--system) 14%,transparent);color:var(--system)}
.chip .open{border:0;background:none;color:inherit;padding:0;font-weight:inherit;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .open:hover{text-decoration:underline}
.chip .x{color:inherit;opacity:.6}
.chip .x:hover{opacity:1}
.chip.static{padding-right:7px}
.succ{display:flex;align-items:center;gap:8px;padding:4px 0;border-bottom:1px dashed var(--rule)}
.succ:last-child{border-bottom:0}
.succ span{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.succ input[type=text]{width:110px;border:1px solid var(--rule);background:var(--paper);border-radius:5px;padding:2px 6px;font-size:12px}
.grid-attr{display:grid;grid-template-columns:1fr 1.3fr auto;gap:5px;align-items:center}
.grid-field{display:grid;grid-template-columns:1.2fr 1fr auto auto;gap:5px;align-items:center}
.grid-field .ref{grid-column:1 / -1;margin:-1px 0 4px 14px;display:flex;gap:6px;align-items:center;font-size:12px;color:var(--muted)}
.grid-attr .inp,.grid-field .inp{padding:4px 7px;font-size:13px}
.req{font-size:12px;color:var(--muted);display:flex;gap:3px;align-items:center;white-space:nowrap}
.kv{display:grid;grid-template-columns:auto 1fr;gap:4px 14px;font-size:13px}
.kv dt{color:var(--muted)} .kv dd{margin:0}
table.mini{width:100%;border-collapse:collapse;font-size:13px}
.mini th{font-size:11.5px;color:var(--muted);font-weight:600;text-align:right;padding:4px 4px;border-bottom:1px solid var(--rule)}
.mini th:first-child,.mini td:first-child{text-align:left}
.mini td{padding:5px 4px;border-bottom:1px solid var(--rule);text-align:right;white-space:nowrap}
.mini td:first-child{white-space:normal}
.mini tr.tot td{font-weight:600;border-bottom:0}
.use{border-top:1px solid var(--rule);padding:8px 0}
.use .p{font-size:12px;color:var(--muted)}
.use button.st{border:0;background:none;padding:0;font-weight:600;text-align:left;color:var(--ink)}
.use button.st:hover{color:var(--sel);text-decoration:underline}
.tags{display:flex;gap:4px;flex-wrap:wrap;margin-top:3px}
.tags.inline{display:block;line-height:1.8}
.tag{font-size:11.5px;border:1px solid var(--rule);border-radius:4px;padding:0 6px;color:var(--muted)}
.tag.out{border-color:var(--data);color:var(--data)}
.tag.own{border-color:var(--role);color:var(--role)}
.tag.acc{border-color:var(--sel);color:var(--sel)}
.crit-list{margin:6px 0 0;padding-left:20px;font-size:13px}
.crit-list li{margin-bottom:2px}
.crit-list .d{color:var(--muted);font-size:12px}
.footer-act{margin-top:28px;padding-top:14px;border-top:1px solid var(--rule);display:flex;gap:8px;flex-wrap:wrap}

/* comments */
.cmt{border:1px solid var(--rule);border-radius:7px;padding:8px 10px;margin-bottom:6px;background:var(--paper)}
.cmt.done{opacity:.65}
.cmt .h{font-size:12px;color:var(--muted);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
.cmt .h .who{font-weight:600;color:var(--ink)}
.cmt .b{white-space:pre-wrap;overflow-wrap:anywhere;margin:4px 0}
.cmt .a{display:flex;gap:10px}
.cmt .a button{border:0;background:none;padding:0;font-size:12px;color:var(--sel)}
.cmt .a button.danger{color:var(--warn)}
.cmt .a button.armed{font-weight:700}
.cmt.done .b{text-decoration:line-through}

/* history */
.hist{max-width:76ch;padding:24px 32px 80px}
.hist h2{font-size:20px;margin:0 0 4px;letter-spacing:-.015em}
.hist .meta{color:var(--muted);font-size:13px;margin-bottom:16px}
.hist .card{border:1px solid var(--rule);background:var(--surface);border-radius:8px;padding:14px 16px;margin-bottom:16px}
.hist .card h3{font-size:14px;margin:0 0 8px}
.hist .acts{display:flex;gap:8px;flex-wrap:wrap;margin-top:12px}
.diff{list-style:none;padding:0;margin:0;font-size:13px}
.diff li{padding:4px 0 4px 18px;position:relative;border-bottom:1px dashed var(--rule)}
.diff li:last-child{border-bottom:0}
.diff li::before{position:absolute;left:2px;font-weight:700}
.diff li.add::before{content:"+";color:var(--system)}
.diff li.del::before{content:"−";color:var(--warn)}
.diff li.chg::before{content:"~";color:var(--data)}

/* help */
.help{max-width:74ch;padding:28px 32px 80px;line-height:1.6}
.help h1{font-size:24px;letter-spacing:-.02em;margin:0 0 6px}
.help .lead{font-size:16px;color:var(--muted);margin:0 0 8px}
.help section{padding-top:22px;margin-top:22px;border-top:1px solid var(--rule)}
.help h2{font-size:18px;margin:0 0 8px;letter-spacing:-.01em}
.help h3{font-size:14px;margin:16px 0 4px}
.help p{margin:0 0 10px}
.help ol,.help ul{margin:0 0 10px;padding-left:22px}
.help li{margin-bottom:4px}
.help dl{display:grid;grid-template-columns:minmax(7em,13em) 1fr;gap:8px 18px;margin:8px 0 10px}
.help dt{font-weight:600}
.help dd{margin:0}
.help kbd{font:12px ui-monospace,Consolas,monospace;border:1px solid var(--rule);border-bottom-width:2px;border-radius:4px;padding:0 5px;background:var(--surface)}
.help table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0 12px}
.help th,.help td{border:1px solid var(--rule);padding:6px 9px;text-align:left;vertical-align:top}
.help th{background:var(--lane);font-weight:600}
.help .tw{overflow-x:auto}

.modal{position:fixed;inset:0;background:rgba(10,14,20,.45);display:flex;align-items:center;justify-content:center;padding:20px;z-index:30}
.modal[hidden]{display:none}
.modal .box{max-height:90vh;overflow:auto;background:var(--surface);border-radius:10px;max-width:560px;width:100%;padding:20px;box-shadow:0 10px 40px rgba(0,0,0,.25)}
.modal h3{margin:0 0 8px;font-size:16px}
.modal textarea{width:100%;height:220px;font:12px/1.4 ui-monospace,Consolas,monospace;border:1px solid var(--rule);border-radius:6px;background:var(--paper);padding:8px}
.modal .acts{display:flex;justify-content:flex-end;gap:8px;margin-top:14px}
</style>
</head>

<script>
(function(){
"use strict";
/* ================= constants & helpers ================= */
const TYPES = {
  role:   {name:'Rolle', plural:'Rollen', add:'Rolle zuweisen…'},
  data:   {name:'Datenobjekt', plural:'Datenobjekte', add:'Datenobjekt hinzufügen…'},
  system: {name:'System', plural:'Systeme', add:'System hinzufügen…'}
};
const STEP_TYPES = {task:'Tätigkeit', decision:'Entscheidung', sub:'Unterprozess', wait:'Wartezeit', start:'Start', end:'Ende'};
const PER = {day:{label:'pro Arbeitstag'}, week:{label:'pro Woche',y:52}, month:{label:'pro Monat',y:12}, quarter:{label:'pro Quartal',y:4}, year:{label:'pro Jahr',y:1}};
const FIELD_TYPES = ['Text','Zahl','Datum','Ja/Nein','Liste','Verweis'];
const LS_KEY = 'prozessmodell.v1';
const G = {GUT:150, PADX:30, COLW:250, NW:204, NH:114, NHF:148, ROWH:142, BOTTOM:46, GRID:10};
const DEFAULT_SETTINGS = {daysPerYear:220, fteHours:1600};

let model = emptyModel();
const ui = {cmtAuthor:null, cmtNewName:false, mergeTarget:'', view:'process', procId:null, stepId:null, objType:'role', objId:null, query:'', confirm:null, verId:null,
  trail:[], procTab:'diagram', crit:false, raciAll:false, raciExtra:[], flowMode:'steps', flowProc:'', flowSel:null};

function emptyModel(){ return {version:2, settings:Object.assign({},DEFAULT_SETTINGS), objects:[], processes:[], comments:[], people:[]}; }
function uid(){ return 'x' + Math.random().toString(36).slice(2,10); }
function esc(s){ return String(s==null?'':s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
const $ = id => document.getElementById(id);
function obj(id){ return id ? model.objects.find(o=>o.id===id) : null; }
function proc(id){ return id ? model.processes.find(p=>p.id===id) : null; }
function step(p,id){ return p ? p.steps.find(s=>s.id===id) : null; }
function findStep(id){ for(const p of model.processes){ const s=p.steps.find(x=>x.id===id); if(s) return {p,s}; } return null; }
function oname(o){ return o ? (o.name||'(ohne Namen)') : ''; }
function pname(p){ return p ? (p.name||'Unbenannter Prozess') : ''; }
function sname(s){ return s ? (s.name||'Unbenannter Schritt') : ''; }
function names(ids){ return (ids||[]).map(obj).filter(Boolean).map(oname); }
function toMin(t){ if(!t || t.value===''||t.value==null||isNaN(+t.value)) return 0; const v=+t.value; return t.unit==='h'?v*60:t.unit==='d'?v*480:v; }
function num(v,d){ return (Math.round(v*Math.pow(10,d||1))/Math.pow(10,d||1)).toLocaleString('de-DE'); }
function fmtMin(m){ if(!m) return '–'; if(m<60) return Math.round(m)+' min'; return num(m/60,1)+' h'; }
function fmtTime(t){ if(!t||t.value===''||t.value==null) return 'Zeit offen'; const u={min:'min',h:'h',d:'AT'}[t.unit]||'min'; return (+t.value).toLocaleString('de-DE')+' '+u; }
function byName(a,b){ return (a.name||'').localeCompare(b.name||'','de'); }
function hasContent(m){ return m.objects.length>0 || m.processes.length>0; }
function isActivity(s){ return s.type==='task'||s.type==='decision'||s.type==='sub'; }

/* ================= normalize ================= */
function normalize(m){
  const out = emptyModel();
  if(!m||typeof m!=='object') return out;
  const st=m.settings||{};
  out.settings={daysPerYear:+st.daysPerYear>0?+st.daysPerYear:220, fteHours:+st.fteHours>0?+st.fteHours:1600};
  out.objects = (Array.isArray(m.objects)?m.objects:[]).filter(o=>o&&o.id&&TYPES[o.type]).map(o=>({
    id:String(o.id), type:o.type, name:String(o.name||''), desc:String(o.desc||''),
    attrs:(Array.isArray(o.attrs)?o.attrs:[]).map(a=>({k:String(a.k||''),v:String(a.v||'')})),
    fields:(Array.isArray(o.fields)?o.fields:[]).map(f=>({name:String(f.name||''),type:FIELD_TYPES.includes(f.type)?f.type:'Text',ref:f.ref||null,req:!!f.req}))
  }));
  const ids = new Set(out.objects.map(o=>o.id));
  const keep = a => [...new Set((Array.isArray(a)?a:[]).map(String).filter(x=>ids.has(x)))];
  const one = x => x && ids.has(String(x)) ? String(x) : null;
  const pids = new Set((Array.isArray(m.processes)?m.processes:[]).filter(p=>p&&p.id).map(p=>String(p.id)));
  out.processes = (Array.isArray(m.processes)?m.processes:[]).filter(p=>p&&p.id).map(p=>{
    const steps=(Array.isArray(p.steps)?p.steps:[]).filter(s=>s&&s.id).map(s=>({
      id:String(s.id), type:STEP_TYPES[s.type]?s.type:'task', name:String(s.name||''), desc:String(s.desc||''),
      owner:one(s.owner), acc:one(s.acc), cons:keep(s.cons), inf:keep(s.inf),
      inputs:keep(s.inputs), outputs:keep(s.outputs), systems:keep(s.systems),
      sub: s.sub && pids.has(String(s.sub)) && String(s.sub)!==String(p.id) ? String(s.sub) : null,
      time:{value:(s.time&&s.time.value!=null)?s.time.value:'', unit:(s.time&&['min','h','d'].includes(s.time.unit))?s.time.unit:'min'},
      pos:(s.pos&&isFinite(s.pos.x)&&isFinite(s.pos.y))?{x:+s.pos.x,y:+s.pos.y}:null
    }));
    const sids=new Set(steps.map(s=>s.id));
    const seen=new Set();
    const edges=(Array.isArray(p.edges)?p.edges:[]).filter(e=>e&&sids.has(e.from)&&sids.has(e.to)&&e.from!==e.to&&!seen.has(e.from+'>'+e.to)&&seen.add(e.from+'>'+e.to)).map(e=>({from:e.from,to:e.to,label:String(e.label||'')}));
    const f=p.freq||{};
    return {id:String(p.id), name:String(p.name||''), desc:String(p.desc||''), layout:p.layout==='lanes'?'lanes':'free',
      freq:{value:(f.value!=null&&f.value!=='')?f.value:'', per:PER[f.per]?f.per:'month'}, steps, edges};
  });
  const valid = t => { const [k,i]=String(t||'').split(':'); return (k==='obj'&&ids.has(i)) || (k==='proc'&&pids.has(i)) || (k==='step'&&out.processes.some(p=>p.steps.some(s=>s.id===i))); };
  const seenP=new Set();
  out.people=(Array.isArray(m.people)?m.people:[]).filter(x=>x&&x.id&&!seenP.has(String(x.id))&&seenP.add(String(x.id))).map(x=>({id:String(x.id),name:String(x.name||'')}));
  const peo=new Set(out.people.map(x=>x.id));
  out.comments=(Array.isArray(m.comments)?m.comments:[]).filter(c=>c&&c.id&&valid(c.target)).map(c=>({id:String(c.id),target:String(c.target),text:String(c.text||''),by:c.by?String(c.by):null,author:c.author&&peo.has(String(c.author))?String(c.author):null,at:+c.at||Date.now(),done:!!c.done}));
  return out;
}

/* ================= computations ================= */
function layers(ids,edges){
  const idset=new Set(ids);
  const E=edges.filter(e=>idset.has(e.from)&&idset.has(e.to)&&e.from!==e.to);
  const out=new Map(ids.map(i=>[i,[]])), indeg=new Map(ids.map(i=>[i,0]));
  E.forEach(e=>{ out.get(e.from).push(e); indeg.set(e.to,indeg.get(e.to)+1); });
  const state={}, back=new Set();
  const dfs=u=>{ state[u]=1; for(const e of out.get(u)){ if(state[e.to]===1) back.add(e); else if(!state[e.to]) dfs(e.to);} state[u]=2; };
  ids.filter(i=>indeg.get(i)===0).forEach(i=>{ if(!state[i]) dfs(i); });
  ids.forEach(i=>{ if(!state[i]) dfs(i); });
  const layer={}, fin=new Map(ids.map(i=>[i,0])); ids.forEach(i=>layer[i]=0);
  E.forEach(e=>{ if(!back.has(e)) fin.set(e.to,fin.get(e.to)+1); });
  const q=ids.filter(i=>fin.get(i)===0);
  while(q.length){ const u=q.shift(); for(const e of out.get(u)){ if(back.has(e)) continue; layer[e.to]=Math.max(layer[e.to],layer[u]+1); fin.set(e.to,fin.get(e.to)-1); if(fin.get(e.to)===0) q.push(e.to);} }
  return {layer,back,E,out};
}
function topoSteps(p){ const L=layers(p.steps.map(s=>s.id),p.edges); return [...p.steps].sort((a,b)=>L.layer[a.id]-L.layer[b.id]||p.steps.indexOf(a)-p.steps.indexOf(b)); }

function stepEffort(s,seen){
  if(s.type==='wait') return 0;
  if(s.type==='sub'){ const q=proc(s.sub); return q&&!seen.has(q.id)?procMin(q,new Set([...seen,q.id])):0; }
  return toMin(s.time);
}
function procMin(p,seen){ seen=seen||new Set([p.id]); return p.steps.reduce((a,s)=>a+stepEffort(s,seen),0); }
function stepDur(s,seen){
  if(s.type==='sub'){ const q=proc(s.sub); return q&&!seen.has(q.id)?critical(q,new Set([...seen,q.id])).len:0; }
  return toMin(s.time);
}
function critical(p,seen){
  seen=seen||new Set([p.id]);
  const L=layers(p.steps.map(s=>s.id),p.edges);
  const order=[...p.steps].sort((a,b)=>L.layer[a.id]-L.layer[b.id]);
  const dist={}, prev={}, dur={};
  order.forEach(s=>{
    dur[s.id]=stepDur(s,seen);
    let best=0, bp=null;
    L.E.forEach(e=>{ if(e.to===s.id && !L.back.has(e) && dist[e.from]!=null && dist[e.from]>=best){ if(dist[e.from]>best||bp===null){ best=dist[e.from]; bp=e.from; } } });
    dist[s.id]=best+dur[s.id]; prev[s.id]=bp;
  });
  const hasOut=new Set(L.E.filter(e=>!L.back.has(e)).map(e=>e.from));
  let cands=order.filter(s=>s.type==='end'); if(!cands.length) cands=order.filter(s=>!hasOut.has(s.id)&&!L.E.some(e=>e.from===s.id&&L.back.has(e))); if(!cands.length) cands=order;
  let end=null; cands.forEach(s=>{ if(end===null||dist[s.id]>dist[end]) end=s.id; });
  const path=[]; let c=end; while(c){ path.unshift(c); c=prev[c]; }
  const edges=new Set(); for(let i=1;i<path.length;i++) edges.add(path[i-1]+'>'+path[i]);
  let bott=null; path.forEach(id=>{ if(bott===null||dur[id]>dur[bott]) bott=id; });
  return {len:end?dist[end]:0, path, set:new Set(path), edges, dur, bott};
}
function ownFreq(p){ const f=p.freq; if(!f||f.value===''||isNaN(+f.value)||+f.value<=0) return null; return +f.value*(f.per==='day'?model.settings.daysPerYear:PER[f.per].y); }
function parentsOf(pid){ const r=[]; model.processes.forEach(q=>q.steps.forEach(s=>{ if(s.type==='sub'&&s.sub===pid) r.push({q,s}); })); return r; }
function effFreq(p,seen){
  const o=ownFreq(p); if(o!=null) return o;
  seen=seen||new Set(); if(seen.has(p.id)) return 0; seen.add(p.id);
  return parentsOf(p.id).reduce((a,x)=>a+effFreq(x.q,new Set(seen)),0);
}
function subReach(pid,seen){ seen=seen||new Set(); if(seen.has(pid)) return seen; seen.add(pid); const p=proc(pid); if(p) p.steps.forEach(s=>{ if(s.type==='sub'&&s.sub) subReach(s.sub,seen); }); return seen; }
function canSub(p,q){ return q.id!==p.id && !subReach(q.id).has(p.id); }
function roleRun(p,seen,acc){
  seen=seen||new Set([p.id]); acc=acc||{};
  p.steps.forEach(s=>{
    if(s.type==='sub'){ const q=proc(s.sub); if(q&&!seen.has(q.id)) roleRun(q,new Set([...seen,q.id]),acc); return; }
    if(s.type==='wait') return;
    const m=toMin(s.time); if(!m) return; const k=s.owner||'_none'; acc[k]=(acc[k]||0)+m;
  });
  return acc;
}
function roleAnnual(roleId){
  const per=[]; let tot=0;
  model.processes.forEach(p=>{ const f=effFreq(p); if(!f) return; let m=0;
    p.steps.forEach(s=>{ if(s.owner===roleId && s.type!=='sub' && s.type!=='wait') m+=toMin(s.time); });
    if(m){ per.push({p,f,m:m*f}); tot+=m*f; } });
  return {tot,per};
}
function fte(minPerYear){ return minPerYear/60/model.settings.fteHours; }
function fmtFte(v){ return v ? v.toLocaleString('de-DE',{maximumFractionDigits:2,minimumFractionDigits:2}) : '–'; }
function fmtFreq(p){ const f=p.freq; if(ownFreq(p)==null) return ''; return (+f.value).toLocaleString('de-DE')+'× '+PER[f.per].label.replace('pro ','/ '); }

function usage(id){
  const res=[];
  for(const p of model.processes){
    for(const s of p.steps){
      const r=[];
      if(s.owner===id) r.push('own');
      if(s.acc===id) r.push('acc');
      if(s.cons.includes(id)) r.push('cons');
      if(s.inf.includes(id)) r.push('inf');
      if(s.inputs.includes(id)) r.push('in');
      if(s.outputs.includes(id)) r.push('out');
      if(s.systems.includes(id)) r.push('sys');
      if(r.length) res.push({p,s,r});
    }
  }
  return res;
}
function refBy(id){ const r=[]; for(const o of model.objects) for(const f of o.fields) if(f.type==='Verweis'&&f.ref===id) r.push({o,f}); return r; }
function findOrCreate(type,name){
  name=name.trim(); if(!name) return null;
  let o=model.objects.find(x=>x.type===type && x.name.trim().toLowerCase()===name.toLowerCase());
  if(!o){ o={id:uid(),type,name,desc:'',attrs:[],fields:[]}; model.objects.push(o); }
  return o;
}

const undoStack=[], redoStack=[]; let lastStable=JSON.stringify(emptyModel()), burst=false, burstTimer=null, pendingLabel='';

async function addVersion(json,label,kind){
  const newest=versions[0];

  let m; try{ m=normalize(JSON.parse(json)); }catch(e){ return; }
  const prev = newest ? (()=>{ try{return normalize(JSON.parse(newest.json));}catch(e){return emptyModel();} })() : emptyModel();
  const changes=diffModels(prev,m).length;
  const v={at:Date.now(), label, kind, json, summary:summarize(m), changes, by:myId||null};
  const id='v'+v.at+'-'+Math.random().toString(36).slice(2,6);
  if(histCol){
    try{ await histCol.doc(id).set(v); histErr=''; pruneDb(); }
    catch(e){ histErr = e&&e.code==='quota_exceeded' ? 'Speicher für Verlauf voll – alte Versionen löschen.' : 'Version konnte nicht gespeichert werden.'; if(ui.view==='hist') render(); }

async function pruneDb(){

function diffModels(a,b){
  const out=[]; const nm=x=>x.name||'(ohne Namen)';

  a.objects.forEach(o=>{ if(!bo.has(o.id)) out.push(['del',`${tn(o.type)} „${nm(o)}“ gelöscht`]); });
  b.objects.forEach(o=>{ const x=ao.get(o.id); if(!x) return;
    if(x.name!==o.name) out.push(['chg',`${tn(o.type)} „${nm(x)}“ umbenannt in „${nm(o)}“`]);
    const parts=[]; if(x.desc!==o.desc) parts.push('Beschreibung'); if(JSON.stringify(x.attrs)!==JSON.stringify(o.attrs)) parts.push('Merkmale'); if(JSON.stringify(x.fields)!==JSON.stringify(o.fields)) parts.push('Datenstruktur');
    if(parts.length) out.push(['chg',`${tn(o.type)} „${nm(o)}“: ${parts.join(', ')} geändert`]); });
  const ap=new Map(a.processes.map(p=>[p.id,p])), bp=new Map(b.processes.map(p=>[p.id,p]));
  b.processes.forEach(p=>{ if(!ap.has(p.id)) out.push(['add',`Prozess „${nm(p)}“ angelegt (${p.steps.length} Schritte)`]); });
  a.processes.forEach(p=>{ if(!bp.has(p.id)) out.push(['del',`Prozess „${nm(p)}“ gelöscht`]); });
  b.processes.forEach(p=>{ const x=ap.get(p.id); if(!x) return;
    if(x.name!==p.name) out.push(['chg',`Prozess „${nm(x)}“ umbenannt in „${nm(p)}“`]);
    if(x.desc!==p.desc) out.push(['chg',`Prozess „${nm(p)}“: Beschreibung geändert`]);
    const xs=new Map(x.steps.map(s=>[s.id,s]));
    const ps=new Set(p.steps.map(s=>s.id));
    p.steps.forEach(s=>{ const o=xs.get(s.id);
      if(!o){ out.push(['add',`„${nm(p)}“: Schritt „${nm(s)}“ hinzugefügt`]); return; }
      const parts=[];
      if(o.name!==s.name) parts.push(`umbenannt (vorher „${nm(o)}“)`);
      if(o.owner!==s.owner) parts.push('Verantwortlich');
      if(JSON.stringify(o.inputs)!==JSON.stringify(s.inputs)) parts.push('Input');
      if(JSON.stringify(o.outputs)!==JSON.stringify(s.outputs)) parts.push('Output');
      if(JSON.stringify(o.systems)!==JSON.stringify(s.systems)) parts.push('Systeme');
      if(toMin(o.time)!==toMin(s.time)) parts.push('Zeitaufwand');
      if(o.desc!==s.desc) parts.push('Beschreibung');
      if(o.type!==s.type) parts.push('Typ '+STEP_TYPES[s.type]);
      if(o.sub!==s.sub) parts.push('Unterprozess');
      if(o.acc!==s.acc||JSON.stringify(o.cons)!==JSON.stringify(s.cons)||JSON.stringify(o.inf)!==JSON.stringify(s.inf)) parts.push('RACI');
      if(parts.length) out.push(['chg',`„${nm(p)}“: Schritt „${nm(s)}“ – ${parts.join(', ')}`]);
    });
    x.steps.forEach(s=>{ if(!ps.has(s.id)) out.push(['del',`„${nm(p)}“: Schritt „${nm(s)}“ entfernt`]); });
    const ek=e=>e.from+'>'+e.to+'|'+e.label; const xe=new Set(x.edges.map(ek)), pe=new Set(p.edges.map(ek));
    const ed=[...pe].filter(k=>!xe.has(k)).length+[...xe].filter(k=>!pe.has(k)).length;
    if(ed) out.push(['chg',`„${nm(p)}“: ${ed} ${ed===1?'Verbindung':'Verbindungen'} geändert`]);
    const mv=p.steps.filter(s=>{ const o=xs.get(s.id); return o && JSON.stringify(o.pos)!==JSON.stringify(s.pos); }).length;
    if(mv) out.push(['chg',`„${nm(p)}“: ${mv} ${mv===1?'Schritt':'Schritte'} verschoben`]);
    if(JSON.stringify(x.freq)!==JSON.stringify(p.freq)) out.push(['chg',`„${nm(p)}“: Häufigkeit geändert`]);
    if(x.layout!==p.layout) out.push(['chg',`„${nm(p)}“: Darstellung ${p.layout==='lanes'?'Swimlanes':'Frei'}`]);
  });
  const ac=new Map((a.comments||[]).map(c=>[c.id,c]));
  const nc=(b.comments||[]).filter(c=>!ac.has(c.id)).length, dc=(b.comments||[]).filter(c=>ac.has(c.id)&&ac.get(c.id).done!==c.done).length;
  const rc=(a.comments||[]).filter(c=>!(b.comments||[]).some(x=>x.id===c.id)).length;
  if(nc) out.push(['add',`${nc} ${nc===1?'Kommentar':'Kommentare'} hinzugefügt`]);
  if(dc) out.push(['chg',`${dc} ${dc===1?'Kommentar':'Kommentare'} erledigt/wieder geöffnet`]);
  if(rc) out.push(['del',`${rc} ${rc===1?'Kommentar':'Kommentare'} gelöscht`]);

  const auc=(b.comments||[]).filter(c=>ac.has(c.id)&&ac.get(c.id).author!==c.author).length; if(auc) out.push(['chg',`${auc} Kommentar-Namen geändert`]);
  if(JSON.stringify(a.settings)!==JSON.stringify(b.settings)) out.push(['chg','Annahmen für Hochrechnung geändert']);
  return out;
}

async function flush(){
  if(!docRef){ dirty=false; setStatus(); return; }
  if(saving){ again=true; return; }
  const j=JSON.stringify(model);
  dirty=false;
  if(j===lastJSON){ setStatus(); return; }
  if(j.length>250000){ failMsg='Modell zu groß für Sync (über 250 KB) – nur lokal gesichert'; setStatus(); return; }
  saving=true; setStatus();
  try{ await docRef.set({json:j, updatedAt:new Date().toISOString()}); lastJSON=j; failMsg=''; }
  catch(e){ failMsg = (e&&e.code==='invalid_argument') ? 'Keine Schreibrechte – Änderungen nur lokal' : 'Sync fehlgeschlagen – lokal gesichert'; }
  saving=false;
  if(again||dirty){ again=false; clearTimeout(timer); timer=setTimeout(flush,400); }
  setStatus();
}
async function initStore(){
  try{ const s=localStorage.getItem(LS_KEY); if(s) model=normalize(JSON.parse(s)); }catch(e){}
  lastStable=JSON.stringify(model);
  render(); updateUndo();
  setStatus('Verbinde…');
  let db=null;
  try{ if(window.claude && typeof window.claude.use==='function') db=await window.claude.use('db'); }catch(e){ db=null; }
  await initHistory(db);
  if(!db){ setStatus(); return; }
  docRef=db.doc('models/main');
  let first=true;
  docRef.onSnapshot(snap=>{
    if(snap.metadata && snap.metadata.hasPendingWrites) return;
    syncOK=true;
    if(!snap.exists){
      if(first && hasContent(model)) commit();
      first=false; setStatus(); return;
    }
    first=false;
    const d=snap.data(); const j=d&&d.json;
    if(typeof j!=='string' || j===lastJSON){ setStatus(); return; }
    if(dirty||saving){ return; }
    try{ model=normalize(JSON.parse(j)); lastJSON=j; lastStable=JSON.stringify(model); undoStack.length=0; redoStack.length=0; cacheLocal(); fixSel(); render(); updateUndo(); }catch(e){}
    setStatus();
  }, err=>{ syncOK=false; docRef=null; failMsg='Sync unterbrochen – Änderungen bleiben in diesem Browser'; setStatus(); });
}

function nodeSize(s,free){

function geomLanes(p){

  const lanes=[], laneIdx={};

  const nodes={};
  steps.forEach(s=>{ const ln=lanes[laneIdx[laneKey(s)]]; const sz=nodeSize(s,false);
    nodes[s.id]={x:G.GUT+G.PADX+L.layer[s.id]*G.COLW+(G.NW-sz.w)/2, y:ln.y+slot[s.id]*G.ROWH+(G.ROWH-sz.h)/2, w:sz.w, h:sz.h}; });
  const width=G.GUT+G.PADX*2+(maxLayer+1)*G.COLW-(G.COLW-G.NW), height=y;
  const edges=[]; let bi=0;
  L.E.forEach(e=>{
    const a=nodes[e.from], b=nodes[e.to];
    let pts, lx, ly;
    if(L.back.has(e) || L.layer[e.to]<=L.layer[e.from]){
      const yb=height+12+(bi++%3)*9, x1=a.x+a.w/2+8, x2=b.x+b.w/2-8;
      pts=[[x1,a.y+a.h],[x1,yb],[x2,yb],[x2,b.y+b.h]]; lx=(x1+x2)/2; ly=yb;
    } else {

function freeAuto(p){ const g=geomLanes(p).nodes, r={}; p.steps.forEach(s=>{ const a=g[s.id]; r[s.id]={x:Math.round(a.x-G.GUT+10), y:Math.round(a.y*1.15+20)}; }); return r; }

/* ---------- RACI ---------- */
const RACI_CYCLE=['','R','A','R/A','C','I'];
function raciVal(s,r){ const R=s.owner===r, A=s.acc===r; if(R&&A) return 'R/A'; if(R) return 'R'; if(A) return 'A'; if(s.cons.includes(r)) return 'C'; if(s.inf.includes(r)) return 'I'; return ''; }
function setRaci(s,r,v){
  if(s.owner===r) s.owner=null; if(s.acc===r) s.acc=null;
  s.cons=s.cons.filter(x=>x!==r); s.inf=s.inf.filter(x=>x!==r);
  if(v==='R'||v==='R/A') s.owner=r;
  if(v==='A'||v==='R/A') s.acc=r;
  if(v==='C') s.cons.push(r);
  if(v==='I') s.inf.push(r);
}
function raciRoles(p){

  const ids=[];
  const add=id=>{ if(id&&obj(id)&&!ids.includes(id)) ids.push(id); };
  topoSteps(p).forEach(s=>{ add(s.owner); add(s.acc); s.cons.forEach(add); s.inf.forEach(add); });
  ui.raciExtra.forEach(add);
  return ids;
}
function raciHTML(p){

  h+=`<table class="raci"><thead><tr><th class="stepcol">Schritt</th>${roles.map(r=>`<th><button data-act="open-obj" data-id="${r}">${esc(oname(obj(r)))}</button></th>`).join('')}<th>Prüfung</th></tr></thead><tbody>`;
  steps.forEach(s=>{

    h+=`<tr><td class="stepcell"><button data-act="sel-step" data-id="${s.id}">${esc(sname(s))}</button><small>${STEP_TYPES[s.type]}${toMin(s.time)?' · '+esc(fmtTime(s.time)):''}</small></td>`+
      roles.map(r=>{ const v=raciVal(s,r); return `<td class="cell"><button class="v-${v.replace('/','')}" data-act="raci-cell" data-step="${s.id}" data-role="${r}" aria-label="${esc(sname(s))}, ${esc(oname(obj(r)))}: ${v||'keine'}">${v}</button></td>`; }).join('')+
      `<td class="chk${miss.length?'':' ok'}">${miss.length?miss.join(', '):'vollständig'}</td></tr>`;
  });
  h+=`</tbody><tfoot><tr><td class="stepcell" style="background:var(--paper)"><small>R / A je Rolle</small></td>${roles.map(r=>{ const R=steps.filter(s=>s.owner===r).length, A=steps.filter(s=>s.acc===r).length; return `<td>${R} / ${A}</td>`; }).join('')}<td></td></tr></tfoot></table>
    <div class="legend"><span><span class="raci-l" style="display:inline-grid;margin:0 4px 0 0;grid-template-columns:22px"><b class="R">R</b></span>Responsible: führt durch (= Prozessverantwortlich)</span><span><span class="raci-l" style="display:inline-grid;margin:0 4px 0 0;grid-template-columns:22px"><b class="A">A</b></span>Accountable: entscheidet, trägt Verantwortung</span><span><span class="raci-l" style="display:inline-grid;margin:0 4px 0 0;grid-template-columns:22px"><b class="C">C</b></span>Consulted: wird vorher gefragt</span><span><span class="raci-l" style="display:inline-grid;margin:0 4px 0 0;grid-template-columns:22px"><b class="I">I</b></span>Informed: wird informiert</span></div></div>`;

/* ---------- data flow ---------- */
function flowGraph(){
  const procs = ui.flowProc ? [proc(ui.flowProc)].filter(Boolean) : model.processes;
  const nodes=new Map(), edges=[], ekeys=new Map();
  const addD=id=>{ const o=obj(id); if(o&&!nodes.has('d:'+id)) nodes.set('d:'+id,{id:'d:'+id,kind:'d',label:oname(o),ref:id}); };
  procs.forEach(p=>p.steps.forEach(s=>{
    if(!s.inputs.length&&!s.outputs.length) return;
    if(ui.flowMode==='steps'){
      nodes.set('s:'+s.id,{id:'s:'+s.id,kind:'s',label:sname(s),sub:pname(p),ref:s.id});
      s.inputs.forEach(d=>{ addD(d); edges.push({from:'d:'+d,to:'s:'+s.id}); });
      s.outputs.forEach(d=>{ addD(d); edges.push({from:'s:'+s.id,to:'d:'+d}); });
    } else {
      s.inputs.forEach(addD); s.outputs.forEach(addD);
      s.inputs.forEach(i=>s.outputs.forEach(o=>{ if(i===o) return; const k='d:'+i+'>d:'+o;
        if(!ekeys.has(k)){ const e={from:'d:'+i,to:'d:'+o,via:[]}; ekeys.set(k,e); edges.push(e); }
        ekeys.get(k).via.push(sname(s)+' ('+pname(p)+')'); }));
    }
  }));
  return {nodes,edges};
}
function flowLayout(G2){
  const ids=[...G2.nodes.keys()];
  const L=layers(ids,G2.edges);
  const byL={}; ids.forEach(i=>{ (byL[L.layer[i]]=byL[L.layer[i]]||[]).push(i); });
  const maxL=Math.max(0,...ids.map(i=>L.layer[i]));
  const idx={}; Object.values(byL).forEach(a=>a.forEach((i,k)=>idx[i]=k));
  for(let sweep=0;sweep<3;sweep++){
    for(let l=1;l<=maxL;l++){ const a=byL[l]||[];
      const bc=i=>{ const pr=L.E.filter(e=>e.to===i&&!L.back.has(e)).map(e=>idx[e.from]); return pr.length?pr.reduce((x,y)=>x+y,0)/pr.length:idx[i]; };
      a.sort((x,y)=>bc(x)-bc(y)); a.forEach((i,k)=>idx[i]=k); }
    for(let l=maxL-1;l>=0;l--){ const a=byL[l]||[];
      const bc=i=>{ const su=L.E.filter(e=>e.from===i&&!L.back.has(e)).map(e=>idx[e.to]); return su.length?su.reduce((x,y)=>x+y,0)/su.length:idx[i]; };
      a.sort((x,y)=>bc(x)-bc(y)); a.forEach((i,k)=>idx[i]=k); }
  }
  const W=184, H=46, CX=250, RY=66, pos={};
  ids.forEach(i=>{ pos[i]={x:30+L.layer[i]*CX, y:30+idx[i]*RY, w:W, h:H}; });
  const rows=Math.max(1,...Object.values(byL).map(a=>a.length));
  return {pos,L,width:30+(maxL+1)*CX, height:30+rows*RY+60};
}
function lineage(G2,sel){
  const up=new Set([sel]), down=new Set([sel]);
  let ch=true; while(ch){ ch=false; G2.edges.forEach(e=>{ if(up.has(e.to)&&!up.has(e.from)){ up.add(e.from); ch=true; } if(down.has(e.from)&&!down.has(e.to)){ down.add(e.to); ch=true; } }); }
  return {up,down};
}

    h+=`<button class="navitem" data-act="flow-sel" data-id="d:${o.id}" aria-current="${ui.flowSel==='d:'+o.id}"><div class="t"><span class="dot data"></span>${esc(oname(o))}</div><div class="m">erzeugt ${pr}×, genutzt ${co}×</div></button>`; });

function renderFlowMain(el){
  const G2=flowGraph();
  let h=`<div class="bar"><h2>Datenfluss</h2><span class="meta">${ui.flowProc?esc(pname(proc(ui.flowProc))):'Alle Prozesse'} · ${[...G2.nodes.values()].filter(n=>n.kind==='d').length} Datenobjekte</span><span class="grow"></span>${ui.flowSel?'<button class="btn" data-act="flow-sel" data-id="">Auswahl aufheben</button>':''}</div>`;
  if(!G2.nodes.size){ el.innerHTML=h+`<div class="empty"><h2>Kein Datenfluss</h2><p>Sobald Schritte Input- oder Output-Daten haben, erscheint hier, wie Daten entstehen, weiterverarbeitet werden und wohin sie fließen.</p></div>`; return; }
  const F=flowLayout(G2);
  const sel=ui.flowSel&&G2.nodes.has(ui.flowSel)?ui.flowSel:null;
  const lin=sel?lineage(G2,sel):null;
  const inL=id=>!lin||lin.up.has(id)||lin.down.has(id);
  let svg=`<svg class="flow" width="${F.width}" height="${F.height}" viewBox="0 0 ${F.width} ${F.height}"><defs><marker id="farr" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--muted)"/></marker><marker id="farrh" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="6" markerHeight="6" orient="auto"><path d="M0 0L10 5L0 10z" style="fill:var(--sel)"/></marker></defs>`;
  let bi=0;
  F.L.E.forEach(e=>{ const a=F.pos[e.from], b=F.pos[e.to]; let d;
    if(F.L.back.has(e)||b.x<=a.x){ const x1=a.x+a.w/2,y1=a.y+a.h,x2=b.x+b.w/2,y2=b.y+b.h, dy=50+(bi++%3)*14; d=`M${x1} ${y1} C${x1} ${y1+dy} ${x2} ${y2+dy} ${x2} ${y2+2}`; }
    else { const x1=a.x+a.w,y1=a.y+a.h/2,x2=b.x,y2=b.y+b.h/2,c=Math.max(40,(x2-x1)/2); d=`M${x1} ${y1} C${x1+c} ${y1} ${x2-c} ${y2} ${x2-1} ${y2}`; }
    const hi=lin&&inL(e.from)&&inL(e.to)&&((lin.up.has(e.from)&&lin.up.has(e.to))||(lin.down.has(e.from)&&lin.down.has(e.to)));
    const cls=lin?(hi?' hi':' dim'):'';
    svg+=`<path class="fe${cls}" d="${d}" marker-end="url(#${hi?'farrh':'farr'})">${e.via?`<title>${esc(e.via.join('\n'))}</title>`:''}</path>`; });
  G2.nodes.forEach(n=>{ const q=F.pos[n.id]; const cls=`fn ${n.kind}${sel===n.id?' sel':''}${lin&&!inL(n.id)?' dim':''}`;
    const lab=n.label.length>26?n.label.slice(0,25)+'…':n.label;
    svg+=`<g class="${cls}" data-act="flow-sel" data-id="${esc(n.id)}" tabindex="0" role="button" aria-label="${esc(n.label)}"><rect x="${q.x}" y="${q.y}" width="${q.w}" height="${q.h}" rx="${n.kind==='d'?14:5}"/>`+
      (n.kind==='s'?`<text class="t" x="${q.x+10}" y="${q.y+19}">${esc(lab)}</text><text class="sub" x="${q.x+10}" y="${q.y+35}">${esc(n.sub.length>28?n.sub.slice(0,27)+'…':n.sub)}</text>`
                   :`<text class="t" x="${q.x+q.w/2}" y="${q.y+q.h/2+4}" text-anchor="middle">${esc(lab)}</text>`)+`<title>${esc(n.label)}</title></g>`; });
  svg+='</svg>';
  el.innerHTML=h+`<div class="scroller" style="padding:0">${svg}</div>`;
  if(sel){ const g=el.querySelector('g.fn.sel'); if(g) g.scrollIntoView({block:'nearest',inline:'center'}); }
}

/* ================= actions ================= */
function curProc(){ return proc(ui.procId); }
function curStep(){ return step(curProc(),ui.stepId); }
function focusSoon(sel){ setTimeout(()=>{ const e=document.querySelector(sel); if(e){ e.focus(); if(e.select) e.select(); } },0); }

function addStep(){
  const p=curProc(); if(!p) return;
  if(ui.procTab==='raci') ui.procTab='diagram';
  let prev=curStep(); if(prev&&prev.type==='end') prev=null;
  const s={id:uid(),type:'task',name:'',desc:'',owner:prev?prev.owner:null,acc:null,cons:[],inf:[],inputs:prev?[...prev.outputs]:[],outputs:[],systems:[],sub:null,time:{value:'',unit:'min'},pos:null};
  let anchor=prev;
  if(!prev && p.steps.length){
    const last=[...p.steps].reverse().find(x=>x.type!=='end'&&!p.edges.some(e=>e.from===x.id)) || null;
    if(last){ p.edges.push({from:last.id,to:s.id,label:''}); s.owner=last.owner; s.inputs=[...last.outputs]; anchor=last; }
  }
  if(prev) p.edges.push({from:prev.id,to:s.id,label:''});
  if(p.layout!=='lanes'){
    if(p.steps.length){ materialize(p);
      const a=anchor||p.steps[p.steps.length-1];
      let x=a.pos.x+G.COLW, y=a.pos.y;
      while(p.steps.some(o=>Math.abs(o.pos.x-x)<G.NW && Math.abs(o.pos.y-y)<G.NHF)) y+=G.NHF+30;
      s.pos={x,y};
    } else s.pos={x:40,y:40};
  }
  p.steps.push(s); ui.stepId=s.id; commit(); render(); focusSoon('[data-bind="step.name"]');
}
function removeRef(field,id){
  const s=curStep(); if(!s) return;
  if(field==='owner') s.owner=null; else if(field==='acc') s.acc=null; else s[field]=s[field].filter(x=>x!==id);
}
function commitPick(input){
  const v=input.value.trim(); if(!v) return;
  const s=curStep(); if(!s) return;
  const o=findOrCreate(input.dataset.type,v); const f=input.dataset.field;
  if(f==='owner'||f==='acc') s[f]=o.id; else if(!s[f].includes(o.id)) s[f].push(o.id);
  input.value='';
  pendingLabel=TYPES[input.dataset.type].name+' verknüpft';
  commit(); renderSide(); renderMain(); renderInsp(); focusSoon(`.pick-in[data-field="${f}"]`);
}
function setAuthor(id){ ui.cmtAuthor=id||''; try{ localStorage.setItem(AUTHOR_LS,id||''); }catch(e){} }
function mergeObjects(srcId,tgtId){
  const src=obj(srcId), tgt=obj(tgtId); if(!src||!tgt||src.type!==tgt.type) return;
  const now=Date.now(), notes=[];
  const T='obj:'+tgt.id, L=`Zusammenlegen mit „${src.name}“`;
  const note=t=>notes.push(t);
  // references
  model.processes.forEach(p=>p.steps.forEach(s=>{
    ['owner','acc'].forEach(k=>{ if(s[k]===srcId) s[k]=tgtId; });
    ['cons','inf','inputs','outputs','systems'].forEach(k=>{ s[k]=[...new Set(s[k].map(x=>x===srcId?tgtId:x))]; });
    ['cons','inf'].forEach(k=>{ s[k]=s[k].filter(x=>x!==s.owner&&x!==s.acc); });
    s.inf=s.inf.filter(x=>!s.cons.includes(x));
  }));
  model.objects.forEach(o=>o.fields.forEach(f=>{ if(f.ref===srcId) f.ref=tgtId===o.id?null:tgtId; }));
  // description
  if(src.desc.trim()){ if(!tgt.desc.trim()) tgt.desc=src.desc; else if(nn(src.desc)!==nn(tgt.desc)) note(`${L}: abweichende Beschreibung „${src.desc}“ nicht übernommen.`); }
  // attributes
  src.attrs.forEach(a=>{ if(!a.k.trim()||a.k.trim().toLowerCase()==='alias') return; const e=tgt.attrs.find(x=>nn(x.k)===nn(a.k));
    if(!e) tgt.attrs.push({k:a.k,v:a.v}); else if(!e.v.trim()) e.v=a.v; else if(a.v.trim()&&nn(a.v)!==nn(e.v)) note(`${L}: Merkmal „${e.k}“ – behalten „${e.v}“, verworfen „${a.v}“.`); });
  // fields
  src.fields.forEach(f=>{ if(!f.name.trim()) return; const e=tgt.fields.find(x=>nn(x.name)===nn(f.name)); const ref=f.ref===tgtId?null:f.ref;
    if(!e){ tgt.fields.push({name:f.name,type:f.type,ref,req:f.req}); return; }
    if(e.type!==f.type) note(`${L}: Feld „${e.name}“ – Typ „${e.type}“ behalten, „${f.type}“ verworfen.`);
    else if(e.type==='Verweis'&&!e.ref&&ref) e.ref=ref;
    if(f.req) e.req=true; });
  // alias
  const al=[...new Set([...aliasesOf(tgt),src.name.trim(),...aliasesOf(src)].filter(x=>x&&nn(x)!==nn(tgt.name)))];
  const ae=tgt.attrs.find(x=>x.k.trim().toLowerCase()==='alias');
  if(al.length){ if(ae) ae.v=al.join(', '); else tgt.attrs.push({k:'Alias',v:al.join(', ')}); }
  // comments
  model.comments.forEach(c=>{ if(c.target==='obj:'+srcId) c.target=T; });
  notes.forEach(t=>model.comments.push({id:uid(),target:T,text:t,by:myId||null,at:now,done:false}));
  model.objects=model.objects.filter(o=>o.id!==srcId);
  ui.raciExtra=ui.raciExtra.map(x=>x===srcId?tgtId:x);
}
function openProc(id,viaSub){
  const p=proc(id); if(!p) return;
  if(viaSub && ui.procId && ui.procId!==id){ const i=ui.trail.indexOf(id); if(i>=0) ui.trail=ui.trail.slice(0,i); else ui.trail.push(ui.procId); }
  else ui.trail=[];
  ui.view='process'; ui.procId=id; ui.stepId=null; ui.confirm=null; if(ui.procTab==='raci') ui.procTab='diagram'; render();
}

  'view':(b)=>{ ui.view=b.dataset.v; ui.confirm=null; render(); },

const ACT_LABEL={'new-proc':'Prozess angelegt','add-step':'Schritt hinzugefügt','step-type':'Schritttyp geändert','toggle-edge':'Verbindung geändert','pick-rm':'Verknüpfung entfernt','del-step':'Schritt gelöscht','del-proc':'Prozess gelöscht','new-obj':'Objekt angelegt','attr-add':'Merkmal hinzugefügt','attr-rm':'Merkmal entfernt','field-add':'Feld hinzugefügt','field-rm':'Feld entfernt','del-obj':'Objekt gelöscht','merge-obj':'Objekte zusammengelegt','person-del':'Name gelöscht','layout':'Darstellung gewechselt','autolayout':'Automatisch angeordnet','raci-cell':'RACI geändert'};
const BIND_LABEL={'proc.name':'Prozessname','proc.desc':'Prozessbeschreibung','proc.freq.value':'Häufigkeit','proc.freq.per':'Häufigkeit','set.days':'Annahmen','set.fte':'Annahmen','step.name':'Schrittname','step.desc':'Schrittbeschreibung','step.time.value':'Zeitaufwand','step.time.unit':'Zeiteinheit','step.sub':'Unterprozess','edge.label':'Bedingung','obj.name':'Objektname','obj.desc':'Objektbeschreibung','attr.k':'Merkmal','attr.v':'Merkmal','field.name':'Datenstruktur','field.type':'Datenstruktur','field.ref':'Datenstruktur','field.req':'Datenstruktur'};

function bind(t,structural){
  pendingLabel=(BIND_LABEL[t.dataset.bind]||'Text')+' geändert';
  const k=t.dataset.bind, v=t.type==='checkbox'?t.checked:t.value, i=+t.dataset.i;
  const p=curProc(), s=curStep(), o=obj(ui.objId);
  switch(k){
    case 'proc.name': p.name=v; break;
    case 'proc.desc': p.desc=v; break;
    case 'proc.freq.value': p.freq.value=v; break;
    case 'proc.freq.per': p.freq.per=v; break;
    case 'set.days': if(+v>0) model.settings.daysPerYear=+v; else return; break;
    case 'set.fte': if(+v>0) model.settings.fteHours=+v; else return; break;
    case 'step.name': s.name=v; break;
    case 'step.desc': s.desc=v; break;
    case 'step.time.value': s.time.value=v; break;
    case 'step.time.unit': s.time.unit=v; break;
    case 'step.sub':
      if(v==='__new'){ const q={id:uid(),name:s.name||'Neuer Unterprozess',desc:'',layout:'free',freq:{value:'',per:'month'},steps:[],edges:[]}; model.processes.push(q); s.sub=q.id; pendingLabel='Unterprozess angelegt'; }
      else s.sub=v||null; structural=true; break;
    case 'edge.label': { const e=p.edges.find(e=>e.from===s.id&&e.to===t.dataset.id); if(e) e.label=v; break; }
    case 'obj.name': o.name=v; break;
    case 'obj.desc': o.desc=v; break;
    case 'attr.k': o.attrs[i].k=v; break;
    case 'attr.v': o.attrs[i].v=v; break;
    case 'field.name': o.fields[i].name=v; break;
    case 'field.type': o.fields[i].type=v; if(v!=='Verweis') o.fields[i].ref=null; break;
    case 'field.ref': o.fields[i].ref=v||null; break;
    case 'field.req': o.fields[i].req=v; break;
    default: return;
  }
  commit();
  if(ui.view==='process'){ renderSide(); renderMain(); if(structural) renderInsp(); }
  else { renderObjTable(); if(structural) renderInsp(); }
}

/* ================= events ================= */
document.addEventListener('click',e=>{
  if(suppressClick){ suppressClick=false; e.preventDefault(); e.stopPropagation(); return; }
  if(!e.target.closest('.menu')) $('exportMenu').hidden=true;
  if(!e.target.closest('.gsearch')) $('gsRes').hidden=true;
  if(e.target.closest('.handle')) return;
  const b=e.target.closest('[data-act]'); if(!b) return;
  if(b.type==='checkbox' && b.dataset.act!=='toggle-edge' && b.dataset.act!=='raci-all') return;
  const act=b.dataset.act;
  if(b.closest('#exportMenu')) $('exportMenu').hidden=true;
  if(act==='sel-step' && e.detail===2 && b.classList.contains('t-sub')){ const fs=findStep(b.dataset.id); if(fs&&fs.s.sub){ openProc(fs.s.sub,true); return; } }
  const f=actions[act];
  if(f){ if(ACT_LABEL[act]) closeBurst(); pendingLabel=ACT_LABEL[act]||''; if(ui.confirm && !/^(del-|restore|delver|autolayout|cmt-del|merge-obj|person-del)/.test(act)) ui.confirm=null; f(b); }
});
document.addEventListener('dblclick',e=>{
  const n=e.target.closest('.node.t-sub'); if(!n) return;
  const f=findStep(n.dataset.id); if(f&&f.s.sub) openProc(f.s.sub,true);
});
document.addEventListener('keydown',e=>{
  const t=e.target;
  if(t.classList && t.classList.contains('pick-in')){
    if(e.key==='Enter'){ e.preventDefault(); commitPick(t); }
    if(e.key==='Backspace' && !t.value){ const s=curStep(); const f=t.dataset.field; if(s && Array.isArray(s[f]) && s[f].length){ s[f].pop(); commit(); renderMain(); renderInsp(); focusSoon(`.pick-in[data-field="${f}"]`);} }
    return;
  }
  if(t.classList && t.classList.contains('raci-add') && e.key==='Enter'){ e.preventDefault(); const o=findOrCreate('role',t.value); if(o){ if(!ui.raciExtra.includes(o.id)) ui.raciExtra.push(o.id); commit(); renderMain(); focusSoon('.raci-add'); } return; }
  if(t.id==='newPerson' && e.key==='Enter'){ e.preventDefault(); actions['person-add-inline'](); return; }
  if(t.id==='personNew' && e.key==='Enter'){ e.preventDefault(); actions['person-add'](); return; }
  if(t.id==='cmtNew' && e.key==='Enter' && (e.ctrlKey||e.metaKey)){ e.preventDefault(); actions['cmt-add'](); return; }
  if(e.key==='Enter' && t.matches && (t.matches('tr.row')||t.matches('g.fn'))){ const f=actions[t.dataset.act]; if(f) f(t); return; }
  if(e.key==='Escape'){ if(!$('modal').hidden) closeModal(); $('exportMenu').hidden=true; }
  if((e.ctrlKey||e.metaKey) && !e.altKey){
    const k=e.key.toLowerCase();
    if(k==='k'){ e.preventDefault(); $('gs').focus(); $('gs').select(); return; }
    if(t && (t.tagName==='INPUT'||t.tagName==='TEXTAREA'||t.tagName==='SELECT'||t.isContentEditable)) return;
    if(k==='z' && !e.shiftKey){ e.preventDefault(); doUndo(); }
    else if(k==='y' || (k==='z' && e.shiftKey)){ e.preventDefault(); doRedo(); }
  }
});
document.addEventListener('change',e=>{
  const t=e.target;
  if(t.classList.contains('pick-in')){ commitPick(t); return; }
  if(t.id==='importFile'){ readImport(t); return; }
  if(t.dataset.actChange==='cmt-author'){ if(t.value==='__new'){ ui.cmtNewName=true; renderInsp(); focusSoon('#newPerson'); } else setAuthor(t.value); return; }
  if(t.dataset.actChange==='merge-target'){ ui.mergeTarget=t.value; ui.confirm=null; renderInsp(); return; }
  if(t.dataset.actChange==='flow-proc'){ ui.flowProc=t.value; ui.flowSel=null; render(); return; }
  if(t.dataset.bind && (t.tagName==='SELECT' || t.type==='checkbox')) bind(t,true);
  else if(t.dataset.bind && (t.dataset.bind.startsWith('set.')||t.dataset.bind.startsWith('proc.freq'))) { renderInsp(); }
});
document.addEventListener('input',e=>{
  const t=e.target;
  if(t.id==='objSearch'){ ui.query=t.value; renderObjTable(); return; }
  if(t.dataset.bindPerson){ const x=person(t.dataset.bindPerson); if(x){ x.name=t.value; pendingLabel='Name geändert'; commit(); renderSide(); } return; }
  if(t.id==='gs'){ runSearch(t.value); return; }
  if(t.classList.contains('pick-in')){
    if(e.inputType==='insertReplacementText' || e.inputType===undefined){ const v=t.value.trim().toLowerCase();
      if(v && model.objects.some(o=>o.type===t.dataset.type && o.name.trim().toLowerCase()===v)) commitPick(t); }
    return;
  }
  if(t.dataset.bind && t.tagName!=='SELECT' && t.type!=='checkbox') bind(t,false);
});

/* ================= search ================= */
let sres=[], sidx=0;
function hl(text,q){ const i=text.toLowerCase().indexOf(q); if(i<0||!q) return esc(text); return esc(text.slice(0,i))+'<mark>'+esc(text.slice(i,i+q.length))+'</mark>'+esc(text.slice(i+q.length)); }
function runSearch(raw){
  const box=$('gsRes'); const q=raw.trim().toLowerCase();
  if(!q){ box.hidden=true; sres=[]; return; }
  const toks=q.split(/\s+/); const hit=str=>toks.every(t=>str.toLowerCase().includes(t));
  const r=[];
  const add=(score,kind,label,sub,go)=>r.push({score,kind,label,sub,go});
  model.processes.forEach(p=>{
    const hay=p.name+' '+p.desc; if(hit(hay)) add(p.name.toLowerCase().startsWith(toks[0])?0:1,'Prozess',pname(p),p.desc,()=>openProc(p.id));
    p.steps.forEach(s=>{ const ex=[...names(s.inputs),...names(s.outputs),...names(s.systems)].join(' ');
      if(hit(s.name+' '+s.desc+' '+STEP_TYPES[s.type]+' '+ex)) add(s.name.toLowerCase().startsWith(toks[0])?0:hit(s.name)?1:2,STEP_TYPES[s.type],sname(s),pname(p)+(s.desc?' · '+s.desc:''),()=>gotoTarget('step:'+s.id)); });
  });
  model.objects.forEach(o=>{
    const a=o.attrs.map(x=>x.k+': '+x.v).join(' · '), f=o.fields.map(x=>x.name).join(', ');
    if(hit(o.name+' '+o.desc+' '+a+' '+f)) add(o.name.toLowerCase().startsWith(toks[0])?0:hit(o.name)?1:2,TYPES[o.type].name,oname(o),(hit(a)&&!hit(o.name)?a:hit(f)&&!hit(o.name)?'Felder: '+f:o.desc),()=>gotoTarget('obj:'+o.id));
  });
  model.comments.forEach(c=>{ const au=person(c.author); if(hit(c.text+' '+(au?au.name:''))) add(3,'Kommentar'+(c.done?' (erledigt)':''),c.text.length>80?c.text.slice(0,80)+'…':c.text,targetLabel(c.target),()=>gotoTarget(c.target)); });
  r.sort((a,b)=>a.score-b.score||a.label.localeCompare(b.label,'de'));
  sres=r.slice(0,40); sidx=0;

let drag=null, suppressClick=false;
function redrawEdges(){ if(!cur) return; const svg=$('edgeSvg'); if(svg) svg.innerHTML=edgesSVG(freeEdgeList(cur.p,cur.nodes),cur.crit); }
const snap=v=>Math.max(10,Math.round(v/G.GRID)*G.GRID);
document.addEventListener('pointerdown',e=>{
  if(!cur || e.button!==0) return;
  const handle=e.target.closest('.handle');
  const node=e.target.closest('.node.free'); if(!node) return;
  const id=node.dataset.id; const canvas=$('canvas'); if(!canvas||!cur.nodes[id]) return;
  if(handle){ e.preventDefault(); e.stopPropagation(); drag={kind:'link',id,canvas,moved:false,target:null}; }
  else drag={kind:'move',id,node,sx:e.clientX,sy:e.clientY,ox:cur.nodes[id].x,oy:cur.nodes[id].y,moved:false};
  try{ (handle||node).setPointerCapture(e.pointerId); }catch(_){}
});
document.addEventListener('pointermove',e=>{
  if(!drag||!cur) return;
  if(drag.kind==='move'){
    const dx=e.clientX-drag.sx, dy=e.clientY-drag.sy;
    if(!drag.moved && Math.hypot(dx,dy)<4) return;
    drag.moved=true; drag.node.classList.add('dragging');
    const x=Math.max(0,drag.ox+dx), y=Math.max(0,drag.oy+dy);
    cur.nodes[drag.id].x=x; cur.nodes[drag.id].y=y; drag.node.style.left=x+'px'; drag.node.style.top=y+'px';
    redrawEdges();
  } else {
    drag.moved=true;
    const r=drag.canvas.getBoundingClientRect(); const a=cur.nodes[drag.id];
    const t=$('tmpEdge'); if(t) t.setAttribute('d',`M${a.x+a.w} ${a.y+a.h/2} L${e.clientX-r.left} ${e.clientY-r.top}`);
    const under=document.elementFromPoint(e.clientX,e.clientY); const tn=under&&under.closest('.node.free');
    document.querySelectorAll('.node.drop').forEach(n=>n.classList.remove('drop'));
    drag.target = tn && tn.dataset.id!==drag.id ? tn.dataset.id : null;
    if(drag.target) tn.classList.add('drop');
  }
});
document.addEventListener('pointerup',()=>{
  if(!drag) return; const d=drag; drag=null;
  if(!d.moved) return;
  suppressClick=true; setTimeout(()=>{suppressClick=false;},0);
  const p=cur.p;
  if(d.kind==='move'){
    materialize(p); const s=step(p,d.id); s.pos={x:snap(cur.nodes[d.id].x),y:snap(cur.nodes[d.id].y)};
    pendingLabel='Schritt verschoben'; commit(); renderMain();
  } else {
    if(d.target && !p.edges.some(x=>x.from===d.id&&x.to===d.target)){ p.edges.push({from:d.id,to:d.target,label:''}); pendingLabel='Verbindung hinzugefügt'; commit(); }
    ui.stepId=d.id; renderMain(); renderInsp();
  }
});
document.addEventListener('pointercancel',()=>{ if(drag){ drag=null; renderMain(); } });
document.addEventListener('keydown',e=>{
  const n=e.target.closest && e.target.closest('.node.free'); if(!n||!cur) return;
  const k={ArrowLeft:[-1,0],ArrowRight:[1,0],ArrowUp:[0,-1],ArrowDown:[0,1]}[e.key]; if(!k) return;

});

/* ---- diagram as pure SVG (also basis for PNG) ---- */
const C={ink:'#1B2430',muted:'#5B6573',rule:'#C9CFC6',lane:'#F2F4F0',role:'#7B3F6E',data:'#9A5F0C',system:'#2F6B57',paper:'#FFFFFF'};
function wrap(text,max,lines){
  const words=String(text).split(/\s+/); const out=[]; let line='';
  for(const w of words){ const t=line?line+' '+w:w; if(t.length<=max) line=t; else { if(line) out.push(line); line=w.length>max?w.slice(0,max-1)+'…':w; if(out.length===lines) break; } }
  if(line&&out.length<lines) out.push(line);
  if(out.length===lines && words.join(' ').length>out.join(' ').length){ const l=out[lines-1]; out[lines-1]=(l.length>=max?l.slice(0,max-1):l)+'…'; }
  return out;
}
function cut(t,n){ t=String(t); return t.length>n?t.slice(0,n-1)+'…':t; }
function diagramSVG(p){
  const g=geom(p), free=g.mode==='free', TOP=56, PAD=20;
  const W=g.width+PAD*2, H=g.height+TOP+PAD;
  const T=(x,y,txt,a)=>`<text x="${x}" y="${y}"${a||''}>${esc(txt)}</text>`;
  let s=`<svg xmlns="http://www.w3.org/2000/svg" width="${W}" height="${H}" viewBox="0 0 ${W} ${H}" font-family="Public Sans, Segoe UI, Arial, sans-serif"><rect width="100%" height="100%" fill="${C.paper}"/>
<defs><marker id="a" viewBox="0 0 10 10" refX="10" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="${C.muted}"/></marker></defs>
${T(PAD,30,pname(p),` font-size="18" font-weight="700" fill="${C.ink}"`)}${T(PAD,47,`${p.steps.length} Schritte · Aufwand ${fmtMin(procMin(p))} · Durchlaufzeit ${fmtMin(critical(p).len)}${fmtFreq(p)?' · '+fmtFreq(p):''}`,` font-size="11" fill="${C.muted}"`)}
<g transform="translate(${PAD},${TOP})">`;
  if(!free) g.lanes.forEach((ln,i)=>{ const o=obj(ln.key);
    s+=`<rect x="0" y="${ln.y}" width="${g.width}" height="${ln.h}" fill="${i%2?C.lane:'#fff'}" stroke="${C.rule}"/><line x1="${G.GUT}" y1="${ln.y}" x2="${G.GUT}" y2="${ln.y+ln.h}" stroke="${C.rule}"/>`;
    wrap(o?oname(o):'Ohne Zuständigkeit',18,3).forEach((l,k)=>{ s+=T(14,ln.y+22+k*16,l,` font-size="12.5" font-weight="600" fill="${o?C.role:C.muted}"`); });
    s+=T(14,ln.y+22+Math.min(3,wrap(o?oname(o):'x',18,3).length)*16,fmtMin(ln.min),` font-size="11" fill="${C.muted}"`); });
  g.edges.forEach(x=>{ s+=`<path d="${ptsD(x.pts)}" fill="none" stroke="${C.muted}" stroke-width="1.4" marker-end="url(#a)"/>`;
    if(x.e.label){ const w=x.e.label.length*6+10; s+=`<rect x="${x.lx-w/2}" y="${x.ly-8}" width="${w}" height="15" rx="3" fill="#fff"/>`+T(x.lx,x.ly+3,x.e.label,` font-size="11" fill="${C.muted}" text-anchor="middle"`); } });
  p.steps.forEach(st=>{ const r=g.nodes[st.id]; const o=obj(st.owner);
    const cx=r.x+r.w/2, cy=r.y+r.h/2;
    if(st.type==='start'||st.type==='end'){
      s+=`<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="${r.h/2}" fill="#fff" stroke="${st.type==='start'?C.system:C.ink}" stroke-width="${st.type==='start'?2:3}"/>`;
      const L=wrap(sname(st),18,2); L.forEach((l,k)=>{ s+=T(cx,cy+4+(k-(L.length-1)/2)*15,l,` font-size="12.5" font-weight="600" fill="${C.ink}" text-anchor="middle"`); }); return;
    }
    if(st.type==='decision'){
      s+=`<polygon points="${cx},${r.y} ${r.x+r.w},${cy} ${cx},${r.y+r.h} ${r.x},${cy}" fill="#fff" stroke="${C.muted}" stroke-width="1.2"/>`;
      const L=wrap(sname(st),16,3); L.forEach((l,k)=>{ s+=T(cx,cy+4+(k-(L.length-1)/2)*14,l,` font-size="11.5" font-weight="600" fill="${C.ink}" text-anchor="middle"`); }); return;
    }
    s+=`<rect x="${r.x}" y="${r.y}" width="${r.w}" height="${r.h}" rx="7" fill="#fff" stroke="${C.rule}" stroke-width="${st.type==='sub'?1:1.2}"${st.type==='wait'?' stroke-dasharray="5 4"':''}/>`;
    if(st.type==='sub') s+=`<rect x="${r.x+3}" y="${r.y+3}" width="${r.w-6}" height="${r.h-6}" rx="5" fill="none" stroke="${C.rule}"/>`;
    let y=r.y+19; const x=r.x+11, mx=Math.floor((r.w-22)/6.4);
    if(free){ s+=T(x,y,cut(o?oname(o):'Ohne Zuständigkeit',mx+4),` font-size="11" font-weight="600" fill="${o?C.role:C.muted}"`); y+=17; }
    wrap(sname(st),mx,2).forEach(l=>{ s+=T(x,y,l,` font-size="13" font-weight="700" fill="${C.ink}"`); y+=16; });
    if(st.type==='sub'){ const q=proc(st.sub); s+=T(x,y,cut('↳ '+(q?pname(q):'nicht verknüpft'),mx+4),` font-size="11" fill="#2E4FD1"`); y+=15; }
    if(st.type==='task'||(st.type==='sub'&&free)){
      [['Ein',names(st.inputs)],['Aus',names(st.outputs)]].forEach(([k,a])=>{ s+=`<text x="${x}" y="${y}" font-size="11"><tspan fill="${C.muted}">${k}  </tspan><tspan fill="${a.length?C.data:C.muted}">${esc(cut(a.join(', ')||'–',mx))}</tspan></text>`; y+=15; }); }
    if(st.type==='wait'){ s+=T(x,y,'Wartezeit',` font-size="11" fill="${C.muted}"`); }
    s+=T(x,r.y+r.h-10,st.type==='sub'?fmtMin(stepEffort(st,new Set([p.id]))):fmtTime(st.time),` font-size="11" fill="${C.muted}"`);
    const sy=names(st.systems).join(', '); if(sy&&st.type==='task') s+=T(r.x+r.w-10,r.y+r.h-10,cut(sy,18),` font-size="11" fill="${C.system}" text-anchor="end"`);
  });
  return s+'</g></svg>';
}

  lanes.forEach((l,i)=>{ const h=i===lanes.length-1?poolH-l.ln.y:l.ln.h; di+=`<bpmndi:BPMNShape id="${l.id}_di" bpmnElement="${l.id}" isHorizontal="true"><dc:Bounds x="30" y="${l.ln.y}" width="${poolW-30}" height="${h}"/></bpmndi:BPMNShape>`; });
  const box={};
  p.steps.forEach(s=>{ const r=g.nodes[s.id]; let b;
    if(s.type==='start'||s.type==='end'||s.type==='wait'){ const cx=r.x+r.w/2, cy=r.y+r.h/2; b={x:cx-18,y:cy-18,w:36,h:36}; }
    else if(s.type==='decision'){ const cx=r.x+r.w/2, cy=r.y+r.h/2; b={x:cx-25,y:cy-25,w:50,h:50}; }
    else b={x:r.x,y:r.y+(r.h-80)/2,w:Math.min(r.w,160),h:80};
    if(b.w===160) b.x=r.x+(r.w-160)/2;
    box[s.id]=b;
    di+=`<bpmndi:BPMNShape id="${sid(s)}_di" bpmnElement="${sid(s)}"${s.type==='decision'?' isMarkerVisible="true"':''}><dc:Bounds x="${Math.round(b.x)}" y="${Math.round(b.y)}" width="${b.w}" height="${b.h}"/></bpmndi:BPMNShape>`; });
  const clip=(pt,next,b)=>{ const cx=b.x+b.w/2, cy=b.y+b.h/2; if(Math.abs(pt[1]-next[1])<1){ return [next[0]>pt[0]?b.x+b.w:b.x, pt[1]]; } return [pt[0], next[1]>pt[1]?b.y+b.h:b.y]; };
  fl.forEach(x=>{ const pts=x.pts.map(q=>[q[0],q[1]]); const a=box[x.e.from], b=box[x.e.to];
    if(pts.length>=2){ pts[0]=clip(pts[0],pts[1],a); const n=pts.length; pts[n-1]=clip(pts[n-1],pts[n-2],b); }
    di+=`<bpmndi:BPMNEdge id="${x.fid}_di" bpmnElement="${x.fid}">${pts.map(q=>`<di:waypoint x="${Math.round(q[0])}" y="${Math.round(q[1])}"/>`).join('')}</bpmndi:BPMNEdge>`; });
  const dpos={}; let dx=G.GUT+G.PADX;

    dpos[d]={x,y:poolH+40,w:36,h:50};
    di+=`<bpmndi:BPMNShape id="DOR_${d}_di" bpmnElement="DOR_${d}"><dc:Bounds x="${Math.round(x)}" y="${poolH+40}" width="36" height="50"/></bpmndi:BPMNShape>`; });
  p.steps.forEach(s=>{ if(!isActivity(s)||s.type==='decision') return; const b=box[s.id];
    s.inputs.filter(d=>dpos[d]).forEach(d=>{ const q=dpos[d]; di+=`<bpmndi:BPMNEdge id="DIA_${s.id}_${d}_di" bpmnElement="DIA_${s.id}_${d}"><di:waypoint x="${Math.round(q.x+18)}" y="${q.y}"/><di:waypoint x="${Math.round(b.x+b.w/2-10)}" y="${Math.round(b.y+b.h)}"/></bpmndi:BPMNEdge>`; });
    s.outputs.filter(d=>dpos[d]).forEach(d=>{ const q=dpos[d]; di+=`<bpmndi:BPMNEdge id="DOA_${s.id}_${d}_di" bpmnElement="DOA_${s.id}_${d}"><di:waypoint x="${Math.round(b.x+b.w/2+10)}" y="${Math.round(b.y+b.h)}"/><di:waypoint x="${Math.round(q.x+18)}" y="${q.y}"/></bpmndi:BPMNEdge>`; }); });
  return `<?xml version="1.0" encoding="UTF-8"?>
<bpmn:definitions xmlns:bpmn="http://www.omg.org/spec/BPMN/20100524/MODEL" xmlns:bpmndi="http://www.omg.org/spec/BPMN/20100524/DI" xmlns:dc="http://www.omg.org/spec/DD/20100524/DC" xmlns:di="http://www.omg.org/spec/DD/20100524/DI" id="Definitions_1" targetNamespace="http://bpmn.io/schema/bpmn" exporter="Prozessmodell" exporterVersion="2">
<bpmn:collaboration id="Collab_1"><bpmn:participant id="Part_1" name="${esc(pname(p))}" processRef="${PID}"/></bpmn:collaboration>
<bpmn:process id="${PID}" name="${esc(pname(p))}" isExecutable="false">${p.desc?`<bpmn:documentation>${esc(p.desc)}</bpmn:documentation>`:''}${laneSet}${xml}</bpmn:process>
<bpmndi:BPMNDiagram id="Diagram_1"><bpmndi:BPMNPlane id="Plane_1" bpmnElement="Collab_1">${di}</bpmndi:BPMNPlane></bpmndi:BPMNDiagram>
</bpmn:definitions>`;
}
