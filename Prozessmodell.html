const impOpt={mode:'merge', prefer:'keep', proc:'update'};
function normName(s){ return String(s==null?'':s).trim().toLowerCase().replace(/\s+/g,' '); }
function mergeModels(base,inc,opt){
  const m=JSON.parse(JSON.stringify(base)); inc=JSON.parse(JSON.stringify(inc));
  const R={objNew:0,objMatched:0,objEnriched:0,procNew:0,procUpdated:0,stepNew:0,stepUpdated:0,stepOrphan:0,edgesNew:0,conflicts:0,comments:0};
  const notes=[];
  const used=new Set([...m.objects.map(o=>o.id),...m.processes.map(p=>p.id),...m.processes.flatMap(p=>p.steps.map(s=>s.id)),...m.comments.map(c=>c.id)]);
  const fresh=id=>{ if(id&&!used.has(id)){ used.add(id); return id; } let x; do{ x=uid(); }while(used.has(x)); used.add(x); return x; };
  const nameOf=id=>{ const o=m.objects.find(x=>x.id===id); return o?(o.name||'(ohne Namen)'):''; };
  const pnameOf=id=>{ const p=m.processes.find(x=>x.id===id); return p?(p.name||'Unbenannter Prozess'):''; };
  const takeImport=(target,label,oldv,newv)=>{ R.conflicts++; notes.push({target,text:`Import-Konflikt: ${label} – bestehend „${oldv}“, Import „${newv}“. ${opt.prefer==='import'?'Importwert übernommen.':'Bestehender Wert behalten.'}`}); return opt.prefer==='import'; };
  const pick=(target,label,oldv,newv)=>{ if(newv===''||newv==null) return oldv; if(oldv===''||oldv==null) return newv; if(String(oldv).trim()===String(newv).trim()) return oldv; return takeImport(target,label,oldv,newv)?newv:oldv; };

  /* objects */
  const omap={};
  inc.objects.forEach(io=>{
    const ex=m.objects.find(o=>o.id===io.id&&o.type===io.type) || m.objects.find(o=>o.type===io.type&&normName(o.name)===normName(io.name)) || m.objects.find(o=>o.type===io.type&&aliasesOf(o).some(a=>normName(a)===normName(io.name)));
    if(ex){ omap[io.id]=ex.id; io.attrs=io.attrs.filter(a=>a.k.trim().toLowerCase()!=='alias'); (ex._inc=ex._inc||[]).push(io); R.objMatched++; }
    else { const oid=io.id; io.id=fresh(oid); omap[oid]=io.id; io._new=true; m.objects.push(io); R.objNew++; }
  });
  const mapO=id=>id&&omap[id]?omap[id]:null;
  m.objects.forEach(ex=>{
    if(ex._new){ delete ex._new; ex.fields.forEach(f=>{ f.ref=f.ref?mapO(f.ref):null; }); return; }
    if(!ex._inc) return; const list=ex._inc; delete ex._inc;
    const before=JSON.stringify(ex), T='obj:'+ex.id, lab=`${TYPES[ex.type].name} „${ex.name}“`;
    list.forEach(io=>{
      ex.desc=pick(T,lab+', Beschreibung',ex.desc,io.desc);
      io.attrs.forEach(a=>{ if(!a.k.trim()) return; const e=ex.attrs.find(x=>normName(x.k)===normName(a.k));
        if(!e) ex.attrs.push({k:a.k,v:a.v}); else e.v=pick(T,`${lab}, Merkmal „${e.k}“`,e.v,a.v); });
      io.fields.forEach(f=>{ if(!f.name.trim()) return; const ref=f.ref?mapO(f.ref):null; const e=ex.fields.find(x=>normName(x.name)===normName(f.name));
        if(!e){ ex.fields.push({name:f.name,type:f.type,ref,req:f.req}); return; }
        const t=pick(T,`${lab}, Feldtyp „${e.name}“`,e.type,f.type); if(t!==e.type){ e.type=t; e.ref=t==='Verweis'?ref:null; }
        if(e.type==='Verweis'&&ref&&ref!==e.ref){ if(!e.ref) e.ref=ref; else if(takeImport(T,`${lab}, Verweis „${e.name}“`,nameOf(e.ref),nameOf(ref))) e.ref=ref; }
        if(f.req&&!e.req) e.req=true; });
    });
    if(JSON.stringify(ex)!==before) R.objEnriched++;
  });

  /* processes */
  const pmap={}, smap={};
  inc.processes.forEach(ip=>{
    const ex = opt.proc==='update' ? (m.processes.find(p=>p.id===ip.id)||m.processes.find(p=>normName(p.name)===normName(ip.name))) : null;
    if(ex && !ex._inc){ pmap[ip.id]=ex.id; ex._inc=ip; R.procUpdated++; }
    else { const oid=ip.id; ip.id=fresh(ip.id); pmap[oid]=ip.id;
      if(m.processes.some(p=>normName(p.name)===normName(ip.name))) ip.name+=' (Import)';
      ip._new=true; m.processes.push(ip); R.procNew++; }
  });
  const remapStep=s=>{ s.owner=mapO(s.owner); s.acc=mapO(s.acc); ['cons','inf','inputs','outputs','systems'].forEach(k=>{ s[k]=[...new Set(s[k].map(mapO).filter(Boolean))]; }); };
  const fixSub=s=>{ s.sub=s._rawSub?(pmap[s._rawSub]||null):null; delete s._rawSub; };
  m.processes.forEach(p=>{
    if(p._new){ delete p._new;
      p.steps.forEach(s=>{ const oid=s.id; s.id=fresh(s.id); smap[oid]=s.id; s._rawSub=s.sub; remapStep(s); R.stepNew++; });
      p.edges=p.edges.map(e=>({from:smap[e.from],to:smap[e.to],label:e.label})).filter(e=>e.from&&e.to);
      return; }
    const ip=p._inc; if(!ip) return; delete p._inc;
    const T='proc:'+p.id;
    p.desc=pick(T,`Prozess „${p.name}“, Beschreibung`,p.desc,ip.desc);
    if(ip.freq.value!==''){ const o=p.freq.value===''?'':`${p.freq.value} ${PER[p.freq.per].label}`, n=`${ip.freq.value} ${PER[ip.freq.per].label}`; if(pick(T,`Prozess „${p.name}“, Häufigkeit`,o,n)===n) p.freq={value:ip.freq.value,per:ip.freq.per}; }
    const matched=new Set(), added=new Set();
    ip.steps.forEach(is=>{
      const es=p.steps.find(s=>s.id===is.id&&!matched.has(s.id)) || p.steps.find(s=>!matched.has(s.id)&&!added.has(s.id)&&normName(s.name)===normName(is.name));
      if(!es){ const oid=is.id; is.id=fresh(is.id); smap[oid]=is.id; is._rawSub=is.sub; remapStep(is); is.pos=null; added.add(is.id); p.steps.push(is); R.stepNew++; return; }
      matched.add(es.id); smap[is.id]=es.id;
      const before=JSON.stringify(es), S='step:'+es.id, L=`Schritt „${es.name}“`;
      es.desc=pick(S,L+', Beschreibung',es.desc,is.desc);
      if(is.type!==es.type && takeImport(S,L+', Typ',STEP_TYPES[es.type],STEP_TYPES[is.type])) es.type=is.type;
      ['owner','acc'].forEach(k=>{ const v=mapO(is[k]); if(!v||v===es[k]) return; if(!es[k]) es[k]=v; else if(takeImport(S,`${L}, ${k==='owner'?'Verantwortlich (R)':'Rechenschaftspflichtig (A)'}`,nameOf(es[k]),nameOf(v))) es[k]=v; });
      ['cons','inf','inputs','outputs','systems'].forEach(k=>{ is[k].map(mapO).filter(Boolean).forEach(v=>{ if(!es[k].includes(v)) es[k].push(v); }); });
      if(is.time.value!==''){ if(es.time.value==='') es.time={value:is.time.value,unit:is.time.unit};
        else if(toMin(es.time)!==toMin(is.time) && takeImport(S,L+', Zeit',fmtTime(es.time),fmtTime(is.time))) es.time={value:is.time.value,unit:is.time.unit}; }
      if(is.sub) es._rawSubMerge=is.sub;
      if(JSON.stringify(es)!==before) R.stepUpdated++;
    });
    p.steps.forEach(s=>{ if(!matched.has(s.id)&&!added.has(s.id)){ R.stepOrphan++; notes.push({target:'step:'+s.id,text:'Import: Schritt ist in der Importdatei nicht enthalten. Prüfen, ob er entfallen ist.'}); } });
    ip.edges.forEach(e=>{ const f=smap[e.from], t=smap[e.to]; if(!f||!t||f===t) return;
      const ex=p.edges.find(x=>x.from===f&&x.to===t);
      if(!ex){ p.edges.push({from:f,to:t,label:e.label}); R.edgesNew++; }
      else if(e.label && e.label!==ex.label){ if(!ex.label) ex.label=e.label; else if(takeImport('step:'+f,`Bedingung zu „${(p.steps.find(s=>s.id===t)||{}).name||''}“`,ex.label,e.label)) ex.label=e.label; } });
  });
  // subprocess links now that all processes are mapped
  m.processes.forEach(p=>p.steps.forEach(s=>{
    if('_rawSub' in s) fixSub(s);
    if(s._rawSubMerge){ const v=pmap[s._rawSubMerge]||null; delete s._rawSubMerge;
      if(v&&v!==s.sub){ if(!s.sub) s.sub=v; else if(takeImport('step:'+s.id,`Schritt „${s.name}“, Unterprozess`,pnameOf(s.sub),pnameOf(v))) s.sub=v; } }
  }));

  /* place new steps in processes with manual positions */
  m.processes.forEach(p=>{
    if(!p.steps.some(s=>s.pos)||!p.steps.some(s=>!s.pos)) return;
    let guard=0;
    while(p.steps.some(s=>!s.pos) && guard++<500){
      const s=p.steps.find(x=>!x.pos&&p.edges.some(e=>e.to===x.id&&(p.steps.find(y=>y.id===e.from)||{}).pos)) || p.steps.find(x=>!x.pos);
      const pe=p.edges.find(e=>e.to===s.id&&(p.steps.find(y=>y.id===e.from)||{}).pos);
      const a=pe?p.steps.find(y=>y.id===pe.from):null;
      let x=a?a.pos.x+G.COLW:Math.max(...p.steps.filter(y=>y.pos).map(y=>y.pos.x))+G.COLW, y=a?a.pos.y:40;
      while(p.steps.some(o=>o.pos&&Math.abs(o.pos.x-x)<G.NW&&Math.abs(o.pos.y-y)<G.NHF)) y+=G.NHF+30;
      s.pos={x,y};
    }
  });
  /* people */
  const amap={};
  (inc.people||[]).forEach(x=>{ const ex=m.people.find(y=>normName(y.name)===normName(x.name)); if(ex) amap[x.id]=ex.id; else { const id=fresh(x.id); amap[x.id]=id; m.people.push({id,name:x.name}); } });
  /* comments */
  const now=Date.now();
  const tmap=t=>{ const [k,i]=String(t).split(':'); const v=k==='step'?smap[i]:k==='proc'?pmap[i]:k==='obj'?omap[i]:null; return v?k+':'+v:null; };
  inc.comments.forEach(c=>{ const t=tmap(c.target); if(!t) return; if(m.comments.some(x=>x.target===t&&x.text.trim()===c.text.trim())) return;
    m.comments.push({id:fresh(c.id),target:t,text:c.text,by:c.by,author:c.author?(amap[c.author]||null):null,at:c.at||now,done:c.done}); R.comments++; });
  notes.forEach(n=>{ if(m.comments.some(x=>x.target===n.target&&x.text===n.text&&!x.done)) return; m.comments.push({id:fresh(null),target:n.target,text:n.text,by:null,at:now,done:false}); });
  return {model:normalize(m), report:R};
}
function importDialog(){

      <ul class="diff" style="margin-top:6px">

      <li class="add">${r.procNew} neue Prozesse${r.procUpdated?`, ${r.procUpdated} vorhandene aktualisiert`:''}</li>
      ${r.procUpdated?`<li class="chg">${r.stepNew} neue Schritte, ${r.stepUpdated} ergänzt, ${r.edgesNew} neue Verbindungen</li>`:''}
      ${r.stepOrphan?`<li class="chg">${r.stepOrphan} vorhandene Schritte fehlen in der Datei – bleiben erhalten, werden per Kommentar markiert</li>`:''}
      ${r.conflicts?`<li class="del">${r.conflicts} Abweichungen – ${o.prefer==='import'?'Importwerte werden übernommen':'bestehende Werte bleiben'}, jede wird als Kommentar „Import-Konflikt“ festgehalten</li>`:'<li class="add">Keine Abweichungen zu bestehenden Werten</li>'}
      ${r.comments?`<li class="add">${r.comments} Kommentare aus der Datei</li>`:''}</ul></div>`;
  }
  openModal(`<h3>Import</h3><p class="hint" style="margin:0 0 10px">Datei: ${inc.processes.length} Prozesse, ${inc.objects.length} Objekte, ${inc.comments.length} Kommentare. Der aktuelle Stand wird vorher im Verlauf gesichert.</p>
    <div style="font-size:13px">
    <b>Art</b>${radio('mode','merge','Zusammenführen','Neues ergänzen, Vorhandenes per ID oder Name erkennen.')}${radio('mode','replace','Ersetzen','Gesamtes Modell durch die Datei ersetzen.')}
    ${o.mode==='merge'?`<div style="margin-top:10px"><b>Bei abweichenden Werten</b>${radio('prefer','keep','Bestehende Werte behalten','Leere Felder werden trotzdem ergänzt.')}${radio('prefer','import','Importwerte übernehmen','Alter Wert steht danach im Kommentar.')}</div>
    <div style="margin-top:10px"><b>Gleichnamige Prozesse</b>${radio('proc','update','Aktualisieren','Schritte per Name abgleichen, neue ergänzen, Positionen und Kommentare bleiben.')}${radio('proc','copy','Als neuen Prozess anlegen','Name erhält den Zusatz „(Import)“.')}</div>`:''}
    </div>${prev}
    <div class="acts"><button class="btn" data-act="modal-close">Abbrechen</button><button class="btn primary" data-act="import-confirm">${o.mode==='merge'?'Zusammenführen':'Ersetzen'}</button></div>`);
}
document.addEventListener('change',e=>{ const t=e.target; if(t.dataset && t.dataset.imp){ impOpt[t.dataset.imp]=t.value; importDialog(); } });
function runImport(){
  const inc=pendingImport; if(!inc) return closeModal();
  closeBurst(); addVersion(JSON.stringify(model),'Vor Import','safety');
  let report=null;
  if(impOpt.mode==='replace'){ pendingLabel='Import (ersetzt)'; model=inc; }
  else { const r=mergeModels(model,inc,impOpt); model=r.model; report=r.report; pendingLabel='Import (zusammengeführt)'; }
  pendingImport=null; ui.stepId=null; ui.objId=null; ui.trail=[]; ui.confirm=null;
  if(report){ const first=inc.processes[0]; const hit=first&&model.processes.find(p=>normName(p.name)===normName(first.name)||normName(p.name)===normName(first.name+' (Import)')); ui.procId=hit?hit.id:ui.procId; }
  else ui.procId=null;
  ui.view='process'; commit(); render();
  if(report) openModal(`<h3>Import abgeschlossen</h3><ul class="diff">
    <li class="add">${report.objNew} Objekte neu, ${report.objEnriched} ergänzt</li>
    <li class="add">${report.procNew} Prozesse neu, ${report.procUpdated} aktualisiert</li>
    <li class="add">${report.stepNew} Schritte neu, ${report.stepUpdated} ergänzt</li>
    ${report.conflicts||report.stepOrphan?`<li class="chg">${report.conflicts+report.stepOrphan} Hinweise als Kommentar – links unter „Offene Kommentare“</li>`:''}</ul>
    <p class="hint">Rückgängig mit ↶ oder über den Verlauf („Vor Import“).${report.stepNew&&report.procUpdated?' Neue Schritte in vorhandenen Prozessen stehen ggf. übereinander: „Auto-Anordnen“ oder verschieben.':''}</p>
    <div class="acts"><button class="btn primary" data-act="modal-close">OK</button></div>`);
  else closeModal();
}

const HELP_TOC=[['start','Worum es geht'],['begriffe','Grundbegriffe'],['erster','Erster Prozess'],['typen','Schritttypen'],['verbinden','Schritte verbinden'],['unter','Unterprozesse'],['ansichten','Frei und Swimlanes'],['raci','RACI-Matrix'],['zeit','Zeitaufwand und Häufigkeit'],['pfad','Kritischer Pfad'],['objekte','Objekte verwalten'],['merkmale','Merkmale und Datenstruktur'],['fluss','Datenfluss'],['suche','Suche'],['kommentare','Kommentare'],['speichern','Speichern und Teilen'],['verlauf','Verlauf und Rückgängig'],['export','Export und Import'],['tasten','Tastatur und Tipps'],['faq','Häufige Fragen']];
function HELP_HTML(){ return `<article class="help">
<h1 id="h-start">Hilfe</h1>
<p class="lead">Mit diesem Werkzeug beschreibst du Arbeitsabläufe: wer macht was, mit welchen Daten, wie lange es dauert und wie oft.</p>
<p>Anders als in einer Zeichnung legst du Rollen, Daten und Systeme nur einmal an und verwendest sie in beliebig vielen Prozessen wieder. Dadurch siehst du jederzeit, wofür eine Rolle zuständig ist, wie viel Arbeitszeit sie bindet oder woher ein bestimmtes Datum stammt.</p>
${hasContent(model)?'':'<p><button class="btn" data-act="load-example">Beispiel laden</button> lädt zwei verknüpfte Beispielprozesse zum Ausprobieren.</p>'}

<section id="h-begriffe"><h2>Grundbegriffe</h2><dl>
<dt>Prozess</dt><dd>Ein vollständiger Ablauf, z. B. „Auskunftsersuchen bearbeiten“. Links in der Prozessansicht aufgelistet.</dd>
<dt>Schritt</dt><dd>Ein Element innerhalb eines Prozesses, etwa eine Tätigkeit oder eine Entscheidung. Im Diagramm ein Kasten, eine Raute oder eine Kapsel.</dd>
<dt>Rolle</dt><dd>Eine Funktion oder Stelle, keine Einzelperson, z. B. „Datenschutzkoordination“.</dd>
<dt>Datenobjekt</dt><dd>Jede Information, die in einen Schritt hineingeht (Input) oder dabei entsteht (Output): Dokumente, Listen, Datensätze, Nachrichten.</dd>
<dt>System</dt><dd>Software oder Hilfsmittel, mit dem ein Schritt erledigt wird.</dd>
<dt>Objekt</dt><dd>Sammelbegriff für Rollen, Datenobjekte und Systeme. Jedes Objekt existiert genau einmal und wird von Schritten nur verknüpft.</dd></dl></section>

<section id="h-erster"><h2>Erster Prozess</h2><ol>
<li>Links bei „Prozesse“ auf <b>Neu</b> klicken und rechts den Namen eintragen.</li>
<li><b>Schritt hinzufügen</b> klicken, oben im rechten Bereich den Schritttyp wählen und einen Namen geben.</li>
<li>Bei <b>R</b> (verantwortlich) eine Rolle eintippen und <kbd>Enter</kbd> drücken. Gibt es die Rolle schon, wird sie verknüpft, sonst neu angelegt. Bei Input-Daten, Output-Daten und Systemen genauso.</li>
<li>Zeitaufwand eintragen.</li>
<li><b>Folgeschritt anlegen</b> erzeugt den nächsten Schritt, verbindet ihn automatisch und übernimmt Verantwortliche sowie die Outputs als neue Inputs.</li>
<li>Zum Schluss beim Prozess die <b>Häufigkeit</b> eintragen, dann wird der Jahresaufwand berechnet.</li></ol>
<p>Einen Schritt bearbeitest du per Klick im Diagramm. <b>Zum Prozess</b> zeigt wieder die Übersicht.</p></section>

<section id="h-typen"><h2>Schritttypen</h2><div class="tw"><table>
<tr><th>Typ</th><th>Darstellung</th><th>Verwendung</th></tr>
<tr><td>Start</td><td>Kapsel, grüner Rand</td><td>Auslöser des Prozesses, z. B. „Anfrage eingegangen“.</td></tr>
<tr><td>Tätigkeit</td><td>Kasten</td><td>Normale Arbeit mit Zeitaufwand.</td></tr>
<tr><td>Entscheidung</td><td>Raute</td><td>Verzweigung. Als Frage formulieren, ausgehende Pfeile mit „ja“ / „nein“ beschriften.</td></tr>
<tr><td>Wartezeit</td><td>Kasten gestrichelt</td><td>Liegezeit ohne Arbeit, z. B. auf Antwort warten. Zählt zur Durchlaufzeit, nicht zum Aufwand.</td></tr>
<tr><td>Unterprozess</td><td>Kasten mit Doppelrand</td><td>Verweist auf einen anderen Prozess. Doppelklick öffnet ihn.</td></tr>
<tr><td>Ende</td><td>Kapsel, dicker Rand</td><td>Ergebnis des Prozesses. Hat keine Nachfolger.</td></tr></table></div>
<p>Start, Ende und Wartezeit haben keine RACI-Zuständigkeiten und keine Systeme.</p></section>

<section id="h-verbinden"><h2>Schritte verbinden</h2><ul>
<li><b>Ziehen:</b> In der Ansicht „Frei“ erscheint am rechten Rand eines Schritts ein Kreis. Diesen auf einen anderen Schritt ziehen.</li>
<li><b>Ankreuzen:</b> Schritt anklicken, unter <b>Führt weiter zu</b> den Nachfolger ankreuzen. Haken entfernen löscht den Pfeil.</li></ul>
<p>Neben dem Haken lässt sich eine Bedingung eintragen, die am Pfeil erscheint. Rücksprünge sind erlaubt, etwa von „Rückmeldung abwarten“ zurück zur Entscheidung.</p></section>

<section id="h-unter"><h2>Unterprozesse</h2>
<p>Große Abläufe lassen sich zerlegen: Ein Schritt vom Typ <b>Unterprozess</b> verweist auf einen eigenständigen Prozess. Im rechten Bereich den Prozess auswählen oder über <b>+ Neuen Prozess anlegen</b> direkt erzeugen.</p><ul>
<li><b>Doppelklick</b> auf den Schritt oder <b>Öffnen</b> wechselt hinein. Oben erscheint eine Pfadleiste zurück zum übergeordneten Prozess.</li>
<li>Aufwand und Durchlaufzeit des Schritts werden aus dem Unterprozess berechnet, auch über mehrere Ebenen.</li>
<li>Ein Unterprozess kann in mehreren Prozessen verwendet werden. Ein Prozess kann sich nicht selbst enthalten, solche Auswahlmöglichkeiten werden ausgeblendet.</li></ul></section>

<section id="h-ansichten"><h2>Frei, Swimlanes und RACI</h2><dl>
<dt>Frei</dt><dd>Schritte mit der Maus beliebig verschieben, die Position bleibt gespeichert. <b>Auto-Anordnen</b> setzt alle Positionen zurück.</dd>
<dt>Swimlanes</dt><dd>Jede verantwortliche Rolle (R) bekommt eine Bahn, die Anordnung erfolgt automatisch. Freie Positionen bleiben beim Umschalten erhalten.</dd>
<dt>RACI</dt><dd>Tabelle der Zuständigkeiten, siehe nächster Abschnitt.</dd></dl></section>

<section id="h-raci"><h2>RACI-Matrix</h2>
<p>RACI beschreibt für jeden Schritt vier Arten der Beteiligung:</p><dl>
<dt>R – Responsible</dt><dd>Führt den Schritt durch. Entspricht dem Prozessverantwortlichen und bestimmt die Swimlane. Genau eine Rolle.</dd>
<dt>A – Accountable</dt><dd>Entscheidet und trägt die Verantwortung für das Ergebnis. Genau eine Rolle, oft identisch mit R (dann „R/A“).</dd>
<dt>C – Consulted</dt><dd>Wird vorher fachlich gefragt. Beliebig viele.</dd>
<dt>I – Informed</dt><dd>Wird über das Ergebnis informiert. Beliebig viele.</dd></dl>
<p>In der Matrix eine Zelle anklicken, um den Wert durchzuschalten: leer → R → A → R/A → C → I. Wer R bekommt, nimmt es der bisherigen Rolle ab. Die Spalte „Prüfung“ meldet Schritte ohne R oder A. Weitere Rollen lassen sich über das Eingabefeld als Spalte hinzufügen. Die gleichen Angaben stehen auch beim einzelnen Schritt unter „Zuständigkeit (RACI)“.</p></section>

<section id="h-zeit"><h2>Zeitaufwand und Häufigkeit</h2>
<p>Zeitaufwand gilt für einen Durchlauf des Schritts. Einheiten: Minuten, Stunden oder Arbeitstage (1 AT = 8 h). Gezählt wird bei der verantwortlichen Rolle (R).</p>
<p>Beim Prozess wird die <b>Häufigkeit</b> eingetragen, z. B. 15 pro Monat. Daraus berechnet das Werkzeug:</p><ul>
<li>Durchläufe und Aufwand pro Jahr, aufgeteilt nach Rolle.</li>
<li><b>FTE</b> (Vollzeitäquivalente): Jahresstunden geteilt durch die Jahresarbeitszeit einer Vollzeitstelle. 0,25 FTE heißt: ein Viertel einer Stelle.</li>
<li>Bei jeder Rolle unter „Objekte“ die Summe über alle Prozesse.</li></ul>
<p>Die Annahmen (Arbeitstage pro Jahr, Stunden je Vollzeitstelle) stehen unter der Rollentabelle eines Prozesses und gelten für das ganze Modell.</p>
<p><b>Unterprozesse ohne eigene Häufigkeit</b> übernehmen sie von den übergeordneten Prozessen. Trägst du beim Unterprozess selbst eine Häufigkeit ein, gilt diese, z. B. wenn er auch eigenständig vorkommt. Für die Rollensumme wird jeder Schritt nur einmal gezählt.</p></section>

<section id="h-pfad"><h2>Kritischer Pfad</h2>
<p>Der kritische Pfad ist die längste Kette von Schritten vom Anfang bis zum Ende, gemessen in Zeit einschließlich Wartezeiten. Seine Länge ist die <b>Durchlaufzeit</b>: So lange dauert ein Fall mindestens, auch wenn parallele Zweige gleichzeitig laufen.</p>
<p><b>Kritischer Pfad</b> über dem Diagramm markiert diese Schritte orange und nennt den längsten Schritt. Wer die Durchlaufzeit verkürzen will, muss an diesen Schritten ansetzen. Rücksprünge werden dabei nicht mitgezählt.</p></section>

<section id="h-objekte"><h2>Objekte verwalten</h2>
<p>Unter <b>Objekte</b> stehen alle Rollen, Datenobjekte und Systeme. Ein Klick zeigt Details und unter <b>Verwendung</b> jeden Schritt mit Art der Beteiligung.</p><ul>
<li><b>Umbenennen</b> wirkt überall.</li>
<li>Bei Rollen: Jahresaufwand und FTE über alle Prozesse.</li>
<li>Bei Datenobjekten: Warnung, wenn ein Datum genutzt, aber nirgends erzeugt wird.</li>
<li><b>Löschen</b> entfernt alle Verknüpfungen. Der Knopf muss zweimal geklickt werden.</li>
<li><b>Zusammenlegen</b> bereinigt Duplikate, etwa „Buchhaltung“ und „Kreditorenbuchhaltung“. Siehe nächster Abschnitt.</li></ul>
<h3 id="h-zusammen">Objekte zusammenlegen</h3>
<p>Ähnlich benannte Objekte desselben Typs zeigt das Werkzeug im Objekt unter <b>Zusammenlegen</b> als „Mögliches Duplikat“ an. Zielobjekt wählen und zweimal auf <b>Zusammenlegen</b> klicken. Dann gilt:</p><ul>
<li>Alle Verknüpfungen in Schritten (R, A, C, I, Input, Output, System) und alle Verweise aus Datenstrukturen gehen auf das Zielobjekt über. Doppelte Einträge werden bereinigt.</li>
<li>Merkmale und Felder, die dem Ziel fehlen, werden übernommen. Bei unterschiedlichen Werten bleibt der Wert des Ziels, der andere steht als Kommentar am Ziel.</li>
<li>Kommentare wandern mit.</li>
<li>Der Name des aufgelösten Objekts wird beim Ziel als Merkmal <b>Alias</b> gespeichert. Spätere Importe mit diesem Namen landen automatisch beim richtigen Objekt.</li></ul>
<p>Rückgängig mit ↶ oder über den Verlauf.</p>
<p>Farben: violett für Rollen, ocker für Datenobjekte, grün für Systeme. Farbige Namen sind anklickbar.</p></section>

<section id="h-merkmale"><h2>Merkmale und Datenstruktur</h2>
<p><b>Merkmale</b> beschreiben das Objekt als Ganzes und haben einen Wert für alle Fälle. <b>Datenstruktur</b> beschreibt, aus welchen Feldern jeder einzelne Fall besteht. Die Werte selbst stehen nicht im Modell.</p>
<div class="tw"><table><tr><th>Datenobjekt „Rechnung“</th><th>Beispiel</th><th>Gilt für</th></tr>
<tr><td>Merkmal</td><td>Aufbewahrung: 10 Jahre</td><td>alle Rechnungen gleich</td></tr>
<tr><td>Datenstruktur</td><td>Feld „Betrag“, Typ Zahl</td><td>jede Rechnung hat ihren eigenen Wert</td></tr></table></div>
<p>Feldtyp <b>Verweis</b> verbindet ein Feld mit einem anderen Objekt, z. B. Rechnung → Bestellung.</p></section>

<section id="h-fluss"><h2>Datenfluss</h2>
<p>Der Reiter <b>Datenfluss</b> zeigt, wie Daten entstehen und weiterverarbeitet werden, über alle Prozesse hinweg oder für einen gewählten Prozess.</p><dl>
<dt>Daten + Schritte</dt><dd>Datenobjekte (ocker, abgerundet) und die Schritte dazwischen. Pfeil in einen Schritt = Input, Pfeil heraus = Output.</dd>
<dt>Nur Daten</dt><dd>Schritte werden zu Pfeilen verdichtet. A → B heißt: Ein Schritt verarbeitet A und erzeugt B. Mit der Maus über einem Pfeil erscheinen die Schritte.</dd></dl>
<p>Ein Klick auf ein Element hebt alles hervor, woraus es entsteht (vorgelagert) und was daraus entsteht (nachgelagert). Rechts stehen die Details. So lässt sich etwa prüfen, welche Ergebnisse von einer bestimmten Quelle abhängen.</p></section>

<section id="h-suche"><h2>Suche</h2>
<p>Das Suchfeld oben durchsucht Prozesse, Schritte, Rollen, Datenobjekte, Systeme, Merkmale, Feldnamen und Kommentare. <kbd>Strg</kbd>+<kbd>K</kbd> springt hinein, Pfeiltasten wählen, <kbd>Enter</kbd> öffnet den Treffer. Mehrere Wörter müssen alle vorkommen.</p></section>

<section id="h-kommentare"><h2>Kommentare</h2>
<p>Prozesse, Schritte und Objekte haben unten im rechten Bereich einen Abschnitt <b>Kommentare</b> für Fragen und offene Punkte. <kbd>Strg</kbd>+<kbd>Enter</kbd> schickt einen Kommentar ab.</p><ul>
<li>Schritte mit offenen Kommentaren tragen im Diagramm eine Sprechblase mit Anzahl.</li>
<li>Links unter den Prozessen stehen alle offenen Kommentare. Ein Klick springt zur Stelle.</li>
<li><b>Erledigt</b> hakt einen Punkt ab, er bleibt sichtbar.</li></ul>
<h3>Namen bei Kommentaren</h3>
<p>Über dem Kommentarfeld wählst du, unter welchem Namen der Kommentar erscheint:</p><ul>
<li><b>Kontoname verwenden:</b> Name des angemeldeten claude.ai-Kontos, automatisch von der Plattform. Funktioniert nur in der geteilten Seite.</li>
<li><b>Name aus der Liste:</b> frei gepflegte Namen, etwa wenn Kommentare aus einem Workshop für andere Personen erfasst werden. Über „+ Neuen Namen anlegen…“ direkt ergänzen.</li></ul>
<p>Die Liste pflegst du unter <b>Objekte → Namensliste</b>: hinzufügen, umbenennen, löschen. Umbenennen wirkt auf alle Kommentare. Der zuletzt gewählte Name wird in diesem Browser vorbelegt. Bei Kommentaren mit Listennamen steht zusätzlich „erfasst von“ mit dem Konto, sofern bekannt, weil Listennamen frei wählbar sind.</p></section>

<section id="h-speichern"><h2>Speichern und Teilen</h2>
<p>Jede Änderung wird automatisch gespeichert. Oben rechts steht der Status:</p><dl>
<dt>Gespeichert</dt><dd>Gesichert und für alle sichtbar, die diese Seite geöffnet haben.</dd>
<dt>Speichert…</dt><dd>Die letzte Änderung wird übertragen.</dd>
<dt>Nur in diesem Browser gespeichert</dt><dd>Keine Verbindung zum gemeinsamen Speicher. Regelmäßig als JSON exportieren.</dd>
<dt>Keine Schreibrechte</dt><dd>Nur Ansicht. Die teilende Person kann Bearbeitungsrechte vergeben.</dd></dl>
<p>Bearbeiten zwei Personen gleichzeitig, gewinnt die zuletzt gespeicherte Änderung.</p></section>

<section id="h-verlauf"><h2>Verlauf und Rückgängig</h2>
<p><b>↶</b> und <b>↷</b> oben rechts (oder <kbd>Strg</kbd>+<kbd>Z</kbd> / <kbd>Strg</kbd>+<kbd>Y</kbd>) nehmen Änderungen dieser Sitzung zurück. Der Reiter <b>Verlauf</b> enthält dauerhaft gespeicherte Versionen: automatisch höchstens alle 10 Minuten, manuell mit eigener Bezeichnung sowie Sicherungen vor Import und Wiederherstellung. Jede Version zeigt, was sich seitdem geändert hat, und lässt sich wiederherstellen.</p></section>

<section id="h-export"><h2>Export und Import</h2><div class="tw"><table>
<tr><th>Format</th><th>Inhalt</th><th>Geeignet für</th></tr>
<tr><td>SVG</td><td>Diagramm des aktuellen Prozesses als Vektorgrafik, in der gewählten Ansicht</td><td>Druck, Dokumente, Confluence</td></tr>
<tr><td>PNG</td><td>Dasselbe als Bild in doppelter Auflösung</td><td>Präsentationen, E-Mail</td></tr>
<tr><td>draw.io</td><td>Bearbeitbares Diagramm. Jeder Schritt trägt seine Angaben (RACI, Daten, Zeit) als Eigenschaften, sichtbar in draw.io über „Daten bearbeiten“</td><td>Weiterbearbeitung in draw.io, auch in Confluence</td></tr>
<tr><td>BPMN 2.0</td><td>Standardformat mit Pools, Lanes je Rolle, Ereignissen, Gateways, Datenobjekten und Layout. RACI und Zeiten als Dokumentation je Element</td><td>Camunda Modeler, Signavio, ADONIS, bpmn.io</td></tr>
<tr><td>RACI CSV</td><td>Matrix des aktuellen Prozesses</td><td>Excel</td></tr>
<tr><td>Schritte CSV</td><td>Alle Schritte aller Prozesse, eine Zeile je Schritt</td><td>Excel, Visio Data Visualizer</td></tr>
<tr><td>JSON</td><td>Vollständiges Modell</td><td>Sicherung, Übergabe, Import</td></tr>
<tr><td>Objektkatalog</td><td>IDs und Namen aller Objekte und Prozesse als Text</td><td>Eingabe für den Prozess-Dokumentierer</td></tr></table></div>
<h3>Import</h3>
<p>Importiert werden JSON-Dateien aus diesem Werkzeug oder im gleichen Format, etwa vom Prozess-Dokumentierer. Vor dem Import wird der aktuelle Stand im Verlauf gesichert. Zwei Arten:</p><dl>
<dt>Zusammenführen</dt><dd>Ergänzt das bestehende Modell. Rollen, Datenobjekte und Systeme werden über gleiche ID oder gleichen Namen (Groß-/Kleinschreibung egal) erkannt und nicht doppelt angelegt.</dd>
<dt>Ersetzen</dt><dd>Das gesamte Modell wird durch die Datei ersetzt.</dd></dl>
<p>Beim Zusammenführen gilt:</p><ul>
<li><b>Leeres wird gefüllt:</b> Fehlen bestehenden Objekten oder Schritten Beschreibung, Zeit, Verantwortliche oder Häufigkeit, werden sie aus der Datei ergänzt.</li>
<li><b>Neues wird angehängt:</b> Neue Merkmale, Felder, Inputs, Outputs, Systeme, C- und I-Rollen und Verbindungen kommen hinzu. Nichts wird gelöscht.</li>
<li><b>Abweichungen werden sichtbar:</b> Steht ein anderer Wert in der Datei, entscheidet die Einstellung „Bestehende Werte behalten“ oder „Importwerte übernehmen“. In beiden Fällen entsteht ein Kommentar „Import-Konflikt“ mit altem und neuem Wert.</li>
<li><b>Gleichnamige Prozesse</b> werden aktualisiert (Schritte per Name abgeglichen, Positionen und Kommentare bleiben) oder als Kopie mit „(Import)“ angelegt.</li>
<li>Schritte, die im Modell stehen, aber in der Datei fehlen, bleiben erhalten und bekommen einen Hinweis-Kommentar.</li></ul>
<p>Eine Vorschau im Dialog zeigt vorher, was passiert.</p>
<h3>Objektkatalog für Prompt</h3>
<p>Exportiert die IDs und Namen aller vorhandenen Objekte und Prozesse als Text. Diesen Text dem Prozess-Dokumentierer mitgeben, damit er vorhandene Rollen, Daten und Systeme wiederverwendet statt neue anzulegen.</p></section>

<section id="h-tasten"><h2>Tastatur und Tipps</h2><ul>
<li><kbd>Strg</kbd>+<kbd>K</kbd> Suche, <kbd>Strg</kbd>+<kbd>Z</kbd> rückgängig, <kbd>Esc</kbd> schließt Menüs und Dialoge.</li>
<li><kbd>Enter</kbd> in einem Auswahlfeld verknüpft oder legt an, <kbd>Rück</kbd> im leeren Feld entfernt das letzte Objekt.</li>
<li>Schritt mit <kbd>Tab</kbd> auswählen und mit Pfeiltasten verschieben, mit <kbd>Umschalt</kbd> in größeren Sprüngen.</li>
<li>Rollen als Funktionen benennen, nicht als Personen. Gleiche Daten immer gleich benennen.</li></ul></section>

<section id="h-faq"><h2>Häufige Fragen</h2>
<h3>Ich habe einen Schritt gelöscht. Was passiert mit den Pfeilen?</h3><p>Hatte er genau einen Vorgänger und einen Nachfolger, werden diese verbunden. Sonst entfallen die Pfeile.</p>
<h3>Was passiert mit Unterprozess-Schritten, wenn ich den Unterprozess lösche?</h3><p>Sie bleiben bestehen, zeigen aber „kein Prozess verknüpft“.</p>
<h3>Warum ist die Durchlaufzeit größer als der Aufwand?</h3><p>Sie enthält Wartezeiten. Kleiner kann sie sein, wenn Schritte parallel laufen.</p>
<h3>Ein Import hat ein Objekt doppelt angelegt. Was tun?</h3><p>Im Duplikat „Zusammenlegen“ nutzen. Der Name wird als Alias gespeichert, beim nächsten Import passiert es nicht wieder.</p>
<h3>Kann ich etwas rückgängig machen?</h3><p>Ja, mit ↶ oder über den Verlauf.</p></section>
